// SPDX-License-Identifier: BSD-3-Clause
//
// The UPF datapath plugin's wire types (D-008: UPF-specific code lives in a
// plugin). The Go controller builds these messages when it programs a session;
// the descriptor set is installed next to the plugin, so a controller can build
// them without generated code (GetSchema carries the same descriptors).
//
// The file name is unique across the process's one protobuf pool: a duplicate
// .proto file name aborts the daemon's registration.

syntax = "proto3";

package upf.pb;

// GtpuDecapArg configures decapsulation on the N3 side.
message GtpuDecapArg {
  // How many sessions the TEID table held. The table is gone: a session's
  // TEID is a rule of the classifier in front of the decap, so the field is
  // reserved rather than reused.
  reserved 2;
  reserved "max_sessions";

  // The UDP port a G-PDU must arrive on. 0 means the standard GTP-U port
  // 2152 (TS 29.281); the codec compares the field exactly.
  uint32 port = 1;
}

// GtpuEncapArg configures encapsulation toward the N3 side.
message GtpuEncapArg {
  // The outer IPv4 source address, dotted. Required: it is the UPF's N3
  // address, a property of the graph, not of a session.
  string src_ip = 1;

  // The outer UDP source port. 0 means a hash of the inner flow (RFC 6864
  // entropy, as VXLANEncap does).
  uint32 src_port = 2;

  // The outer UDP destination port. 0 means 2152 (TS 29.281).
  uint32 dst_port = 3;

  // How many tunnels the table holds. 0 means 65536. One record per session,
  // written in the same transaction as the rules that select it.
  uint32 max_tunnels = 4;
}

// -- resources ---------------------------------------------------------------
//
// Both modules register one transactional resource (control_v2, D-129): the
// controller writes it as part of the session's single transaction, in the
// order docs/design.md gives (resources, then the action record, then the rule
// that names it). Neither resource references another, so a session change is
// one flat transaction.

// UrrCountArg configures the per-rule usage counters (TS 29.244 7.5.2.4: the
// data half of a URR's measurement).
message UrrCountArg {
  // How many rules the counters hold -- the graph's ActionId space, i.e. the
  // ActionTable's capacity. A rule's counter is two cells (packets and octets)
  // per worker, so this is also the module's memory: capacity x 2 x 8 bytes x
  // 64 (kMaxWorkers, whether or not that many workers run: 64 MiB at the
  // default capacity). 0 means 65536.
  uint32 capacity = 1;
}

// CounterKey is the key of the counting module's "<module>/counters" table: the
// ActionId of the rule whose traffic is measured -- the id the PDR rule
// returned and the classifier wrote into the packet's `action_id` metadata.
message CounterKey {
  // 0 names no rule.
  uint32 action_id = 1;
}

// CounterEntry marks one rule's traffic as measured: the entry's existence is
// the whole test, so the message has no fields. The counts are not here: they
// are the module's per-worker planes, because a resource value is copied on
// every publish and the controller rewrites a session's records on every
// modification -- a number kept in the value would be zeroed by a handover.
message CounterEntry {}

// UrrCountCommandGetCountsArg selects the rules to read.
message UrrCountCommandGetCountsArg {
  // The rules to read, by ActionId. Empty reads every rule the table holds.
  repeated uint32 action_ids = 1;
}

// UrrCountCommandGetCountsResponse is one reading of the counters: every
// worker's plane summed. A reading is exact for each cell -- a worker writes
// only its own -- not one global instant.
message UrrCountCommandGetCountsResponse {
  message RuleCount {
    uint32 action_id = 1;
    uint64 packets = 2;
    uint64 octets = 3;
  }
  repeated RuleCount counts = 1;
}

// TeidKey is the key of the decap module's "<module>/sessions" table: the TEID
// of an uplink G-PDU (TS 29.281). The controller writes one entry per session,
// and the decap accepts only TEIDs the table holds -- a G-PDU for a session
// this UPF does not have is dropped, never forwarded into another session's
// rules.
message TeidKey {
  // 0 is invalid: no tunnel carries it, and an unknown TEID is not a session.
  uint32 teid = 1;
}

// SessionEntry is what the control plane and an operator can see about a
// session the decap accepts. The packet path reads no field of it: the
// entry's existence is the whole test.
message SessionEntry {
  // The UE's IPv4 address, dotted: what this session's PDR rules match.
  string ue_ip = 1;
}

// TunnelKey is the key of the encap module's "<module>/tunnels" table: the
// ActionId the PDR rule named, which the classifier wrote into the packet's
// "action_id" metadata (BESS D-141). Keying the tunnel by the same id is what
// lets one lookup resolve the whole session: the action record names the meter
// and the next hop, the tunnel record names the N3 peer and the TEID.
message TunnelKey {
  // 0 means "no action", i.e. no session: never a key.
  uint32 action_id = 1;
}

// TunnelEntry is the per-session half of a FAR's Outer Header Creation
// (TS 29.244 8.2.56): how this session's downlink packets leave on N3. The
// controller resolves the FAR once, at programming time; the packet path does
// one indexed load and chases no control-plane relation.
message TunnelEntry {
  // The gNB's F-TEID for this session: the TEID the gNB expects on downlink.
  uint32 teid = 1;

  // The gNB's outer IPv4 address, dotted.
  string gnb_ip = 2;

  // The outer Ethernet source (the N3 port's address), 6 bytes.
  bytes ether_src = 3;

  // The outer Ethernet destination (the peer's address), 6 bytes.
  bytes ether_dst = 4;
}
