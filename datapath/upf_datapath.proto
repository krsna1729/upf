// SPDX-License-Identifier: BSD-3-Clause
//
// The UPF datapath plugin's wire types (D-008: UPF-specific code lives in a
// plugin). The Go controller builds these messages when it programs a session;
// the descriptor set is installed next to the plugin, so a controller can build
// them without generated code (GetSchema carries the same descriptors).
//
// The file name is unique across the process's one protobuf pool: a duplicate
// .proto file name aborts the daemon's registration.

syntax = "proto3";

package upf.pb;

// GtpuDecapArg configures decapsulation on the N3 side.
message GtpuDecapArg {
  // How many sessions the TEID table held. The table is gone: a session's
  // TEID is a rule of the classifier in front of the decap, so the field is
  // reserved rather than reused.
  reserved 2;
  reserved "max_sessions";

  // The UDP port a G-PDU must arrive on. 0 means the standard GTP-U port
  // 2152 (TS 29.281); the codec compares the field exactly.
  uint32 port = 1;
}

// UpfArpResponderArg configures the ARP responder for the subscriber
// addresses the deployment holds. Its entries are a *live* resource: one per
// session per UE address, written and erased with the session.
message UpfArpResponderArg {
  // How many entries the table holds. 0 means 65536. The table is sized once,
  // at construction: a write that finds no room is refused, with nothing
  // visible, rather than growing under a running packet path.
  uint32 max_entries = 1;
}

// UpfArpResponderEntryKey is one address the responder answers for, and
// UpfArpResponderEntryValue the Ethernet address its replies carry. The names
// are the fork's ArpResponder's, so a controller that writes
// {"ip": ..., "mac_addr": ...} writes this resource unchanged.
message UpfArpResponderEntryKey {
  // The address, dotted (0.0.0.0 is refused: it names no subscriber).
  string ip = 1;
}

message UpfArpResponderEntryValue {
  // The MAC the reply's sender hardware address carries: the interface's own,
  // lower case and colon-separated.
  string mac_addr = 1;
}

// GtpuResponderArg configures the GTP-U echo responder (TS 29.281 7.2). The reply
// is the request with its addresses and ports swapped and its payload dropped,
// so the module needs no other argument.
message GtpuResponderArg {
  // The UDP port an Echo Request must arrive on. 0 means the standard GTP-U
  // port 2152; the codec compares the field exactly.
  uint32 port = 1;

  // The Recovery Time Stamp the Echo Response carries (TS 29.281 8.7): the
  // seconds from 00:00:00 on 1 January 1900 to when this GTP-U entity
  // started. 0 means the time the module started, which is the entity's own
  // start in a graph that is applied when the daemon starts.
  uint64 recovery_time_stamp = 2;

  // Track the peer's Error Indications (TS 29.281 7.3.1): each one's TEID IE
  // is recorded in a small lock-free table, one monotonic count per TEID, for
  // the control side's get_errors to read. Off, an Error Indication is dropped
  // like any other message the module does not answer -- which is what a
  // deployment whose controller does not report them wants.
  bool track_errors = 3;
}

// GtpuResponderCommandGetErrorsArg selects the TEIDs to read.
message GtpuResponderCommandGetErrorsArg {
  // The TEIDs to read, as the peer's Error Indications named them (the TEID
  // the peer could not reach, which is the one this UPF sent to). Empty reads
  // every entry the table holds.
  repeated uint32 teids = 1;
}

// GtpuResponderCommandGetErrorsResponse is one reading of the Error Indications
// the responder has seen. The count only grows: the reporting side keeps its
// own baseline per TEID and needs no clear, so a read never races a packet.
message GtpuResponderCommandGetErrorsResponse {
  message ErrorCount {
    uint32 teid = 1;
    uint64 count = 2;
  }
  repeated ErrorCount errors = 1;
  // Indications that found no free slot (the table is small and a flood of
  // distinct TEIDs would not be a tunnel failure but a scan).
  uint64 untracked = 2;
}

// GtpuEncapArg configures encapsulation toward the N3 side.
message GtpuEncapArg {
  // The outer IPv4 source address, dotted. Required: it is the UPF's N3
  // address, a property of the graph, not of a session.
  string src_ip = 1;

  // The outer UDP source port. 0 means a hash of the inner flow (RFC 6864
  // entropy, as VXLANEncap does).
  uint32 src_port = 2;

  // The outer UDP destination port. 0 means 2152 (TS 29.281).
  uint32 dst_port = 3;

  // How many tunnels the table holds. 0 means 65536. One record per session,
  // written in the same transaction as the rules that select it.
  uint32 max_tunnels = 4;

  // The metadata attribute the tunnel's key is read from, 4 bytes, network
  // order. Empty reads "action_id", the ActionTable's attribute, which is
  // what every graph without ATSSS steering uses. A graph with an
  // AtsssSteer module sets this to the attribute AtsssSteer writes
  // ("tunnel_id"): a MAR's two accesses each have a tunnel record of their
  // own, and the selected access names it. A packet whose tunnel id is 0
  // (not steered) falls back to "action_id".
  string tunnel_attr = 5;
}

// AtsssSteerArg configures active/standby access steering (TS 29.244 7.5.2.8,
// a MAR's Steering Mode 0: one access active, the other on standby).
message AtsssSteerArg {
  // How many policies and health records the tables hold. 0 means 65536.
  // A PFCP MAR ID is session-local; the compiler allocates a global policy id
  // from this space for each live MAR.
  uint32 capacity = 1;

  // The metadata attribute carrying the policy id, 4 bytes, network order.
  // The PDR matcher writes it from a rule's global policy id; 0 means the packet is not
  // steered and is passed through unchanged. Required.
  string policy_attr = 2;

  // The Router next hop the selected access leaves by, 4 bytes, network order.
  // Required; a policy names a nonzero hop for each access.
  string next_hop_attr = 3;

  // The GtpuEncap tunnel record the selected access names, 4 bytes, network
  // order. Empty leaves the attribute unwritten; a graph whose accesses tunnel
  // sets it to the attribute GtpuEncapArg.tunnel_attr names.
  string tunnel_attr = 4;

  // The usage-counter record the selected access names, 4 bytes, network
  // order. Empty leaves the attribute unwritten (the first deployment has no
  // per-access URR accounting).
  string accounting_attr = 5;
}

enum AtsssSteeringMode {
  ATSSS_ACTIVE_STANDBY = 0;
}

// AtsssAccessAction is one access of a steering policy: where its packets go
// and the health record that says whether the access is usable.
message AtsssAccessAction {
  // The Router next hop, nonzero.
  uint32 next_hop_id = 1;
  // The GtpuEncap tunnel record, 0 when this access adds no outer header.
  uint32 tunnel_id = 2;
  // The usage-counter record, 0 when this access has none.
  uint32 accounting_id = 3;
  // The health record this access reads, nonzero. The policy references the
  // record, so a transaction that erases a live access's health is refused.
  uint32 health_id = 4;
}

// AtsssSteeringPolicy is one MAR's rule, as the packet path applies it.
message AtsssSteeringPolicy {
  AtsssSteeringMode mode = 1;
  // The preferred access's index in `access`: 0 or 1. The other access is the
  // standby.
  uint32 preferred = 2;
  // Exactly two: the 3GPP access and the non-3GPP access, in that order.
  repeated AtsssAccessAction access = 3;
}

// AtsssSteeringPolicyKey is one key of "<module>/policies": the global policy
// id the PDR
// matcher wrote into the packet's policy attribute. 0 names no policy.
message AtsssSteeringPolicyKey {
  uint32 policy_id = 1;
}

// AtsssAccessHealthKey is one key of "<module>/health": an access's health
// record. 0 names none.
message AtsssAccessHealthKey {
  uint32 health_id = 1;
}

// AtsssAccessHealth is whether an access is usable. The record is shared by
// every policy that uses the access, so one report updates one entry.
message AtsssAccessHealth {
  bool available = 1;
}

// -- resources ---------------------------------------------------------------
//
// Two of the modules register one transactional resource each (control_v2,
// D-129): GtpuEncap's "tunnels" and UrrCount's "counters" (one UrrCount
// instance per direction, plus one on the buffering branch). The controller
// writes them as part of the session's single transaction, in the order
// docs/design.md gives (resources, then the action record, then the rule that
// names it). Neither resource references another, so a session change is one
// flat transaction. GtpuDecap and GtpuResponder own no resource: a session's TEID is
// a rule of the classifier in front of the decap, and an echo belongs to the
// path. The packet store's per-flow resource is BESS's own module, not this
// plugin's, and is documented there.

// UrrCountArg configures the per-rule usage counters (TS 29.244 7.5.2.4: the
// data half of a URR's measurement).
message UrrCountArg {
  // How many rules the counters hold -- the graph's ActionId space, i.e. the
  // ActionTable's capacity. A rule's counter is two cells (packets and octets)
  // per worker, so this is also the module's memory: capacity x 2 x 8 bytes x
  // 64 (kMaxWorkers, whether or not that many workers run: 64 MiB at the
  // default capacity). 0 means 65536.
  uint32 capacity = 1;
}

// CounterKey is the key of the counting module's "<module>/counters" table: the
// ActionId of the rule whose traffic is measured -- the id the PDR rule
// returned and the classifier wrote into the packet's `action_id` metadata.
message CounterKey {
  // 0 names no rule.
  uint32 action_id = 1;
}

// CounterEntry marks one rule's traffic as measured: the entry's existence is
// the whole test, so the message has no fields. The counts are not here: they
// are the module's per-worker planes, because a resource value is copied on
// every publish and the controller rewrites a session's records on every
// modification -- a number kept in the value would be zeroed by a handover.
message CounterEntry {}

// UrrCountCommandGetCountsArg selects the rules to read.
message UrrCountCommandGetCountsArg {
  // The rules to read, by ActionId. Empty reads every rule the table holds.
  repeated uint32 action_ids = 1;
  // Whether this reading opens the next window: true clears each rule's first
  // packet stamp, so the stamp the next reading reports is the next window's
  // own. The reporting side sets it, because a report is what opens a window;
  // a diagnostic read -- an operator's, a test's -- leaves it false and finds
  // the window's first packet where the last one left it.
  bool restart_window = 2;
}

// UrrCountCommandGetCountsResponse is one reading of the counters: every
// worker's plane summed. A reading is exact for each cell -- a worker writes
// only its own -- not one global instant.
message UrrCountCommandGetCountsResponse {
  message RuleCount {
    uint32 action_id = 1;
    uint64 packets = 2;
    uint64 octets = 3;
    // The time of the first and of the last packet this rule counted since the
    // previous reading, in the reading's own monotonic domain (read_monotonic_ns
    // below). Both are 0 for a rule whose traffic was not counted since that
    // reading. They are what Time of First Packet and Time of Last Packet are
    // made of (TS 29.244 8.2.44, 8.2.45), and where a duration measurement
    // starts (5.2.2.2.1).
    uint64 first_packet_ns = 4;
    uint64 last_packet_ns = 5;
  }
  repeated RuleCount counts = 1;
  // The reading's own clock: the monotonic stamp the per-rule stamps are in
  // (tsc_to_ns(rdtsc())) and the wall clock (gettimeofday) at the same moment,
  // so the control side can place a rule's stamp on the absolute clock a PFCP
  // timestamp carries.
  uint64 read_monotonic_ns = 2;
  uint64 read_wall_unix_ns = 3;
}

// TunnelKey is the key of the encap module's "<module>/tunnels" table: the
// ActionId the PDR rule named, which the classifier wrote into the packet's
// "action_id" metadata (BESS D-141). Keying the tunnel by the same id is what
// lets one lookup resolve the whole session: the action record names the meter
// and the next hop, the tunnel record names the N3 peer and the TEID.
message TunnelKey {
  // 0 means "no action", i.e. no session: never a key.
  uint32 action_id = 1;
}

// TunnelEntry is the per-session half of a FAR's Outer Header Creation
// (TS 29.244 8.2.56): how this session's downlink packets leave on N3. The
// controller resolves the FAR once, at programming time; the packet path does
// one indexed load and chases no control-plane relation.
message TunnelEntry {
  // The gNB's F-TEID for this session: the TEID the gNB expects on downlink.
  uint32 teid = 1;

  // The gNB's outer IPv4 address, dotted.
  string gnb_ip = 2;

  // The outer Ethernet source (the N3 port's address), 6 bytes.
  bytes ether_src = 3;

  // The outer Ethernet destination (the peer's address), 6 bytes.
  bytes ether_dst = 4;

  // The QoS Flow Identifier (TS 29.244 8.2.89) this session's downlink G-PDUs
  // carry in their PDU Session Container: the GTP-U extension header of type
  // 0x85 (TS 29.281 5.2.2.7, content TS 38.415 5.5.2). 0 means write no
  // container, so the G-PDU is the 8-octet header and the T-PDU and nothing
  // else.
  uint32 qfi = 5;

  // The SMF's Transport Level Marking (TS 29.244 8.2.12, in a FAR's forwarding
  // parameters) for this session's outer headers: the IE's two octets as an
  // OctetString, the DSCP in the high octet and the mask in the low one. The
  // encap applies it over the inner packet's own ToS/Traffic Class -- the mask
  // names the bits the inner header keeps, the ECN bits with the spec's 0xFC
  // (the NOTE under 8.2.12) -- and 0 means the SMF asked for no marking, so the
  // encap copies the inner TOS as it always did. A record that predates the
  // field reads as 0 and loads with the copy behaviour.
  uint32 marking = 6;
}

// -- the per-session matcher ------------------------------------------------
//
// PdrMatch holds one key per session -- "<module>/rules", a map resource whose
// value is *that session's rule list* -- so a session change is one upsert of
// O(that session's rules) rather than a rewrite of a table every session shares
// (docs/design.md, "the keyed write"). The session is the id the packet path
// reads from the module's key attribute: on the uplink the F-TEID the decap
// wrote, which is what identifies a session on N3. The downlink's selector --
// longest-prefix match on the UE address for an N6 packet that carries no
// tunnel -- is the next step and is not this; the module's key attribute names
// what its graph writes today.

// PdrMatchArg configures the per-session matcher.
message PdrMatchArg {
  // The metadata attribute the session key is read from: 4 bytes, network
  // order, the id "<module>/rules" is keyed by. Required, and it must be an
  // attribute some module in the graph writes (the decap writes "upf_teid").
  string key_attr = 1;

  // How many sessions the map holds. 0 means 65536. The map is allocated once,
  // at creation, and is not resized: a session that does not fit is refused at
  // programming time rather than silently dropped by the packet path.
  uint32 max_sessions = 2;

  // The metadata attribute a matched rule's global policy id is written to, 4 bytes,
  // network order. Empty writes none. A graph with an AtsssSteer module sets
  // this to the attribute AtsssSteerArg.policy_attr names; a rule without a
  // MAR writes 0, which steers nothing.
  string steering_attr = 3;
}

// PdrMatchSettings is the module's own settings, beside the map: the singleton
// "<module>/settings". The map is the sessions; this is the module.
message PdrMatchSettings {
  // The attribute the session key is read from, as PdrMatchArg's field of the
  // same meaning. Changing it re-points the packet path at another attribute,
  // which is a wiring change an operator may make without recreating the
  // module; the sessions already written keep their keys.
  string key_attr = 1;
}

// PdrMatchKey is one key of "<module>/rules": the session, as the packet path
// reads it. 0 names no session and is refused.
message PdrMatchKey {
  uint32 session = 1;
}

// PdrMatchRule is one PDR of the session, as the rule it compiles to: the
// 5-tuple the packet carries, with prefixes and port ranges, and the action
// the packet leaves with. It is BESS's FirewallArg.Rule's shape (the fields
// the firewall path writes, protobuf/module_msg.proto) with the ordering the
// list gives it: a session's rules are in the SMF's precedence order, and the
// first rule that matches the packet wins.
message PdrMatchRule {
  // Source and destination prefixes, CIDR, the length mandatory: "" is any
  // address of the rule's family, and a filter whose address carries host bits
  // means its network ("10.10.1.5/16" is "10.10.0.0/16").
  string src_ip = 1;
  string dst_ip = 2;

  // IP protocol number, 0 for any.
  uint32 proto = 3;

  // Inclusive port ranges. An absent high bound is the full range, which is why
  // they are `optional`: a plain 0 default would mean "port 0 only".
  uint32 src_port_low = 4;
  optional uint32 src_port_high = 5;
  uint32 dst_port_low = 6;
  optional uint32 dst_port_high = 7;

  // Drop matching packets instead of forwarding them. A rule that drops cannot
  // name an action.
  bool drop = 8;

  // The ActionId a matching packet carries, 0 for none: the module writes it
  // into the packet's "action_id" metadata, so an ActionTable downstream
  // selects the action this rule names (BESS D-141), exactly as the
  // WildcardMatch path's rules do.
  uint32 action_id = 9;

  // The QoS flow the rule is about (TS 29.244 8.2.89): the rule matches only a
  // packet whose PDU Session Container carried this QFI, which the decap
  // writes as the "qfi" metadata attribute (0 when no container was carried).
  // Absent, the rule matches a packet of any QFI. 0..63; it is `optional` so
  // that "no QFI named" is not "QFI 0". The order is still the list's: the
  // first rule that matches the packet's tuple *and* its QFI wins.
  optional uint32 qfi = 10;

  // The global policy id the compiler allocated for this PDR's MAR (TS 29.244
  // 8.2.34), 0 for none. The module
  // writes it into the graph's steering attribute, where AtsssSteer selects
  // the access. A rule that drops cannot carry one.
  uint32 steering_policy_id = 11;
}

// PdrMatchEntry is one session's rule list, in the session's precedence order:
// the first rule that matches wins. The order is the list's, not a field's --
// the WildcardMatch path inverts the Precedence into the classifier's priority
// because its rules are separate keys, and this one keeps the SMF's own order
// because they are not.
message PdrMatchEntry {
  repeated PdrMatchRule rules = 1;
}
