# SPDX-License-Identifier: BSD-3-Clause

# The custom profile's graph (docs/design.md, "Profiles"): deploy/upf.yaml with
# both PDR tables replaced by this tree's keyed per-session matcher (`PdrMatch`):
# one map key per session, whose value is that session's rules in SMF precedence
# order. The uplink's key is the F-TEID the decap wrote; the downlink's is the
# session id the selector in front of the matcher writes, because a packet from
# the data network carries no tunnel to name its session with. Everything else
# is upf.yaml's -- the ports, the TEID table and the echo behind its default
# gate, the chains, the encap, the End Marker's socket -- so the two graphs
# differ by exactly three things:
#
#   - `pdr_ul` (a WildcardMatch every session shares) is `pdr_match_ul`;
#   - `pdr_dl` is `sel_dl` -> `pdr_match_dl`: the selector names the session by
#     the UE address the packet is addressed to, and the matcher holds that
#     session's own rules;
#   - `mt_ul_read` is gone. It existed only to give the decap's `upf_teid` an
#     offset (a write-only attribute gets none, core/metadata.cc); the matcher
#     reads `upf_teid` itself as its key, which does the same.
#
# Selecting the profile and applying this graph are the same decision seen from
# the two sides:
#
#   upfd -profile custom -bess <bessd> -n3-addr <addr> ...
#   bessctl apply deploy/custom-pdrmatch.yaml
#
# The downlink's selector is an exact match on (route domain, UE IPv4 address),
# which is what the spec asks the session look-up to be (TS 29.244 5.2.1 with
# 8.2.62's exact address): this graph is a one-instance deployment, so its key
# is the address alone (`-select-fields-dl dst_ip`). A longest-prefix match is
# the structure for an IPv6 UE *prefix* or a framed route, neither of which this
# UP serves yet (docs/claims.md).
#
# What this path refuses, as compiled today: a BUFF FAR (no buffering verdict in
# this module), a PDI naming a QFI (its rules are the 5-tuple), the IPv6 UE
# address and F-TEID (the keys are IPv4-only), and a second session whose PDRs
# name one UE address (the selector's key is the session's). Its rules do carry
# port ranges and SDF prefixes of both families, which the wildcard table cannot.
#
# Three values here are the deployment's and must match upfd's flags, exactly
# as in upf.yaml: enc's src_ip = -n3-addr, and rt/next_hops' ids 1 and 2 are the
# uplink's and downlink's next hops (their egress_gates are this file's
# connections: 0 toward n6_out, 1 toward enc).

ports:
  # Two DPDK ports, bound before bessd starts (docs/datapath.md).
  - name: n3
    driver: PMDPort
    arg: {port_id: 0}
    num_rx_queues: 1
  - name: n6
    driver: PMDPort
    arg: {port_id: 1}
    num_rx_queues: 1
  # The control plane's End Marker socket (TS 29.244 5.3.2): no PMD, so a
  # deployment binds it without a NIC. The path is what upfd's -end-marker names.
  - name: cp_marker
    driver: UnixSocketPort
    arg: {path: /tmp/upf-end-marker.sock}

modules:
  # The decap declares "upf_teid" and is listed before its reader: attributes
  # are laid out in registration order.
  - name: decap0
    mclass: GtpuDecap

  - name: n3_in
    mclass: PortInc
    arg: {port: n3}
  - name: n6_in
    mclass: PortInc
    arg: {port: n6}
  - name: cp_in
    mclass: PortInc
    arg: {port: cp_marker}

  # -- ingress -----------------------------------------------------------------
  # The F-TEID match, one rule per session, whose default gate is the echo
  # module (the only message that reaches a UPF on a TEID no session names is an
  # Echo Request, TS 29.281 7.2); a G-PDU no session names is still dropped.
  - name: teid
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 46, num_bytes: 4}
      default_gate: 1
  - name: echo0
    mclass: GtpuResponder
    arg: {track_errors: true}

  # -- the uplink's matcher ----------------------------------------------------
  # The session is the metadata the decap wrote, not a field of the packet: the
  # F-TEID this session's PDU Session Container arrived on. A packet whose key
  # the map does not hold is dropped. max_sessions sizes the map, allocated once
  # (upfd's -capacity is the id space the compiler allocates in).
  - name: pdr_match_ul
    mclass: PdrMatch
    arg: {key_attr: upf_teid, max_sessions: 65536}

  # The downlink's selector and matcher, in place of upf.yaml's shared table: a
  # packet from the data network carries no tunnel, so the session it belongs to
  # is the one whose UE address it is addressed to. sel_dl is that look-up --
  # one rule per (route domain, UE address), whose value is the session id --
  # and it writes that id into the packet's "action_id" metadata, which is the
  # key pdr_match_dl reads. Its own rules reference sel_at's actions, because
  # BESS validates a rule's action id as a reference into the table the module
  # declares (D-021): sel_at is never in the packet path, and holds one record
  # per session id with neither meter nor next hop.
  - name: sel_dl
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 30, num_bytes: 4}
      action_resource: sel_at/actions
  - name: sel_at
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_dl/meters, next_hops: rt/next_hops}
  - name: pdr_match_dl
    mclass: PdrMatch
    arg:
      key_attr: action_id
      max_sessions: 65536
      # The MAR ID of a matched rule, where the rule has one. AtsssSteer reads
      # this attribute; a rule without a MAR writes 0 and is not steered.
      steering_attr: steering_policy_id

  # -- the two chains ----------------------------------------------------------
  # The matcher writes the matched rule's ActionId into the packet's "action_id"
  # metadata and passes it on: the ActionTable downstream selects the action,
  # exactly as the wildcard table's rules do (D-141). The capacities are the id
  # spaces upfd's -capacity names.
  - name: at_ul
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_ul/meters, next_hops: rt/next_hops}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: at_dl
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_dl/meters, next_hops: rt/next_hops}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: atsss_dl
    mclass: AtsssSteer
    arg:
      policy_attr: steering_policy_id
      next_hop_attr: next_hop_id
      tunnel_attr: tunnel_id

  - name: rt
    mclass: Router
  - name: enc
    mclass: GtpuEncap
    arg:
      src_ip: "192.0.2.1"
      max_tunnels: 65536
      # AtsssSteer writes tunnel_id; 0 means "not steered", and the encap
      # falls back to action_id for those packets.
      tunnel_attr: tunnel_id

  # -- egress ------------------------------------------------------------------
  - name: n6_out
    mclass: PortOut
    arg: {port: n6}
  - name: n3_out
    mclass: PortOut
    arg: {port: n3}

connections:
  - {upstream: n3_in, downstream: teid}
  - {upstream: teid, downstream: decap0}
  - {upstream: teid, downstream: echo0, ogate: 1}
  - {upstream: echo0, downstream: n3_out}
  - {upstream: decap0, downstream: pdr_match_ul}
  - {upstream: pdr_match_ul, downstream: at_ul}
  - {upstream: at_ul, downstream: mt_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: rt}
  - {upstream: rt, downstream: n6_out}

  - {upstream: n6_in, downstream: sel_dl}
  - {upstream: sel_dl, downstream: pdr_match_dl}
  - {upstream: pdr_match_dl, downstream: at_dl}
  - {upstream: at_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: atsss_dl}
  - {upstream: atsss_dl, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: n3_out}
  - {upstream: cp_in, downstream: n3_out}

resources:
  # The actions' next hops: the deployment's, not a session's. One hop per
  # direction's egress, as in upf.yaml.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0}
    - key: {id: 2}
      value: {egress_gate: 1}
