# SPDX-License-Identifier: BSD-3-Clause

# Two network instances on one UPF, one subscriber address, one downlink: the
# case TS 23.501 5.6.12 NOTE 1 gives as the reason a Network Instance exists
# ("overlapping UE IP addresses assigned by multiple Data Networks") and the
# case TS 29.244 5.2.1 lets the look-up be scoped by. deploy/pdrmatch-path.yaml
# is this graph's sibling: same uplink, same selector and matcher, one
# difference -- the downlink arrives on two *interfaces* instead of one, and the
# selector's key carries which one.
#
#   uplink    src_up  -> rewrite_up  -\
#                                      > teid -> decap0 -> pdr_match_ul -> at_ul -> mt_ul -> cnt_ul -> rt -> dump_n6 -> sink_n6
#             src_up2 -> rewrite_up2 -/                                                          rt -> dump_n9 -> sink_n9 (ogate 2)
#   downlink  src_dn1 -> rewrite_dn1 -\
#                                      > dn_vif -> merge_dn -> mt_vif -> sel_dl -> pdr_match_dl -> at_dl -> mt_dl -> cnt_dl -> rt -> enc -> dump_d -> sink_n3
#             src_dn2 -> rewrite_dn2 -/
#
# The two downlink frames are identical except for their destination MAC
# (02:00:00:00:01:01 and 02:00:00:00:02:02): the same 8.8.8.8:5000 ->
# 10.45.0.2:53 the data network's answer is, to the same subscriber address, in
# two different data networks. The Vif is what tells them apart -- it classifies
# by destination MAC and writes the interface's `route_domain` -- and that
# metadata attribute is the selector's first key field, so the two sessions'
# rules are two rules for one address.
#
# The Vif needs no port: VifArg takes one input gate and demuxes to its
# interfaces' gates, so a Source-fed stream exercises the real domain writer
# (module_msg.proto: "VIFs sharing a physical port or pipeline"). ci/veth-port.sh
# is the arm that puts a Vif on a real port; this one is the domain key's.
#
# Two things about the Vif are load-bearing and easy to get wrong:
#   - it writes `route_domain` only when *both* `vif_id` and `route_domain` have
#     metadata offsets (vif.cc's write_metadata guard), and an attribute no
#     module reads gets no offset at all (core/metadata.cc, FillOffsetArrays).
#     mt_vif is that reader: without it the Vif writes nothing and both frames
#     fall into one domain.
#   - the domains it writes must be inside the Router's `max_domains` bound,
#     which defaults to 1 (domain 0 only), and they must be the domains
#     `upfd -instances` gives the same two instances. Here: domains 1 and 2, so
#     `max_domains: 3`, and `upfd -instances internet:1;campus:2`. Domain 0 stays
#     what it is everywhere else in this tree: the interface a PDI naming no
#     instance gets (internal/session's default).
#
# Nothing here is a session: the Sources run from the moment the graph is
# applied and every rule, action, meter, counter and tunnel is written by the Go
# controller, so a zero before a session and packets after it are the control
# arm and its evidence. ci/pdrmatch-2dn.sh deploys this graph and drives it.
#
# The frames, byte for byte (deploy/pdrmatch-path.yaml's, with the destination
# MAC the two interfaces):
#   uplink    G-PDUs to TEID 0x11223344 (the internet session's F-TEID) and
#             0x11223345 (campus's), each holding the UE's packet
#             10.45.0.2:5000 -> 8.8.8.8:53
#   downlink  8.8.8.8:5000 -> 10.45.0.2:53 to each interface's MAC, which the
#             downlink PDR matches ("permit out udp from any to assigned 53")
#             and whose FAR's outer header creation names the session's own TEID
#             (0x55667788 for internet, 0x55667789 for campus) toward the gNB.
#
# Metadata attributes are laid out in module registration order: decap0 writes
# "upf_teid" before pdr_match_ul reads it, and dn_vif writes "route_domain"
# before sel_dl reads it. mt_vif sits between them because the Vif's write needs
# the reader to exist, not because it changes the packets.

ports:
  - name: cp_marker
    driver: UnixSocketPort
    arg: {path: /tmp/upf-end-marker.sock}

modules:
  - name: decap0
    mclass: GtpuDecap
  # The uplink's matcher: one key per session ("<module>/rules"), the key being
  # the F-TEID the decap wrote. Two instances' sessions are told apart here by
  # their tunnels, exactly as in deploy/session-instances.yaml.
  - name: pdr_match_ul
    mclass: PdrMatch
    arg: {key_attr: upf_teid, max_sessions: 65536}
  - name: dump_u
    mclass: Dump
    arg: {interval: 1}
  - name: src_up
    mclass: Source
    arg: {pkt_size: 87, burst: 0}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABJAAFAAEARUIwKFB4CwAACAQhoCGgANQAAMP8AJREiM0RFAAAlAAFAAEARIIkKLQACCAgICBOIADUAEQAAaGVsbG8tdXBm"
  # The second instance's uplink stream: the same UE packet on its own tunnel.
  # burst 0: ci/pdrmatch-2dn runs one stream at a time so a Dump's
  # one-packet-a-second sample is that stream's.
  - name: src_up2
    mclass: Source
    arg: {pkt_size: 87, burst: 0}
  - name: rewrite_up2
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABJAAFAAEARUIwKFB4CwAACAQhoCGgANQAAMP8AJREiM0VFAAAlAAFAAEARIIkKLQACCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: teid
    mclass: WildcardMatch
    arg:
      fields:
        # Eth (14) + IPv4 (20) + UDP (8) + the GTP-U header's flags, type and
        # length (4). One rule per session; a TEID no rule names is dropped.
        - {offset: 46, num_bytes: 4}
  - name: at_ul
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_ul/meters, next_hops: rt/next_hops}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  # The uplink is domain 0 by definition, and it has to be written: BESS gives
  # an attribute a read offset only if every path to the reader writes it, and
  # the downlink's Vif write does not cover the uplink path. Without this
  # module the selector below is routed to its default gate (its
  # `route_domain` read has no valid offset) and no downlink frame matches.
  - name: set_domain
    mclass: SetMetadata
    arg:
      attrs:
        - {name: route_domain, size: 4, value_int: 0}
  # Three route domains: 0 is the uplink's (written above), 1 and 2 are the two
  # interfaces' -- so max_domains must be 3, and upfd's -max-domains must agree.
  - name: rt
    mclass: Router
    arg: {max_domains: 3}
  - name: dump_n6
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n6
    mclass: Sink
  # The campus instance's exit: a convention of this graph, not of N6 -- an
  # uplink forward toward a peer UPF leaves on N9 the same way.
  - name: dump_n9
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n9
    mclass: Sink

  # -- the downlink, one stream per data network ------------------------------
  - name: src_dn1
    mclass: Source
    arg: {pkt_size: 51, burst: 0}
  - name: rewrite_dn1
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAEBAgAAAAACCABFuAAlAAFAAEARH9EICAgICi0AAhOIADUAEQAAaGVsbG8tdXBm"
  - name: src_dn2
    mclass: Source
    arg: {pkt_size: 51, burst: 0}
  - name: rewrite_dn2
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAICAgAAAAACCABFuAAlAAFAAEARH9EICAgICi0AAhOIADUAEQAAaGVsbG8tdXBm"
  # The two data networks' interfaces, on one input gate: destination MAC
  # 02:00:00:00:01:01 -> domain 1, 02:00:00:00:02:02 -> domain 2, and anything
  # else to gate 0. Each carries its own address, which is what a Vif answers
  # ARP for; no frame here is an ARP request.
  - name: dn_vif
    mclass: Vif
    arg:
      default_gate: 0
      interfaces:
        - {id: 1, vlan: 0, mac_addr: "02:00:00:00:01:01", ip_addr: "192.168.1.1", route_domain: 1, gate: 1}
        - {id: 2, vlan: 0, mac_addr: "02:00:00:00:02:02", ip_addr: "192.168.2.1", route_domain: 2, gate: 2}
  - name: sink_vif
    mclass: Sink
  - name: merge_dn
    mclass: Merge
  # The reader that makes the Vif's writes real (see the header): both
  # `vif_id` and `route_domain` must have offsets, or the Vif writes neither.
  - name: mt_vif
    mclass: MetadataTest
    arg: {read: {vif_id: 4, route_domain: 4}}
  # The selector: one rule per (route domain, UE address), whose value is the
  # session id, written into the packet's `action_id` metadata. Its key is the
  # shape `upfd -select-fields-dl route_domain,dst_ip` names, and sel_at holds
  # the action record each rule references (BESS validates a rule's action id as
  # a reference); sel_at is never in the packet path.
  - name: sel_dl
    mclass: ExactMatch
    arg:
      fields:
        # The interface the frame arrived on, as the Vif wrote it, then the UE
        # address it is addressed to: 14 + 12 + 4 = the IPv4 destination.
        - {attr_name: route_domain, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
      action_resource: sel_at/actions
  - name: sel_at
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_dl/meters, next_hops: rt/next_hops}
  - name: pdr_match_dl
    mclass: PdrMatch
    arg: {key_attr: action_id, max_sessions: 65536}
  - name: at_dl
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_dl/meters, next_hops: rt/next_hops}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: enc
    mclass: GtpuEncap
    arg: {src_ip: "192.0.2.1", max_tunnels: 65536}
  - name: dump_d
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n3
    mclass: Sink

  # The End Marker's path (TS 29.244 5.3.2): idle but for the marker.
  - name: cp_in
    mclass: PortInc
    arg: {port: cp_marker}
  - name: dump_m
    mclass: Dump
    arg: {interval: 1}
  - name: sink_m
    mclass: Sink

connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: teid}
  - {upstream: src_up2, downstream: rewrite_up2}
  - {upstream: rewrite_up2, downstream: teid}
  - {upstream: teid, downstream: decap0}
  - {upstream: decap0, downstream: dump_u}
  - {upstream: dump_u, downstream: pdr_match_ul}
  - {upstream: pdr_match_ul, downstream: at_ul}
  - {upstream: at_ul, downstream: mt_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: set_domain}
  - {upstream: set_domain, downstream: rt}
  - {upstream: rt, downstream: dump_n6, ogate: 0}
  - {upstream: dump_n6, downstream: sink_n6}
  - {upstream: rt, downstream: dump_n9, ogate: 2}
  - {upstream: dump_n9, downstream: sink_n9}

  - {upstream: src_dn1, downstream: rewrite_dn1}
  - {upstream: rewrite_dn1, downstream: dn_vif}
  - {upstream: src_dn2, downstream: rewrite_dn2}
  - {upstream: rewrite_dn2, downstream: dn_vif}
  - {upstream: dn_vif, downstream: merge_dn, ogate: 1}
  - {upstream: dn_vif, downstream: merge_dn, ogate: 2}
  - {upstream: dn_vif, downstream: sink_vif, ogate: 0}
  - {upstream: merge_dn, downstream: mt_vif}
  - {upstream: mt_vif, downstream: sel_dl}
  - {upstream: sel_dl, downstream: pdr_match_dl}
  - {upstream: pdr_match_dl, downstream: at_dl}
  - {upstream: at_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: dump_d}
  - {upstream: dump_d, downstream: sink_n3}

  - {upstream: cp_in, downstream: dump_m}
  - {upstream: dump_m, downstream: sink_m}

workers:
  - {wid: 0, core: 0}

resources:
  # The actions' next hops: the deployment's, not a session's. Id 1 is the
  # internet instance's uplink exit (N6, gate 0), id 3 is campus's (the peer
  # UPF's direction, gate 2), and id 2 is the access side's -- both sessions'
  # downlink forwards name it, because a forward toward the UE leaves through
  # the encap whatever instance the PDI named.
  rt/next_hops:
    - key: {id: 1}
      # The internet instance's exit, with that data network's L2: the Router
      # writes a resolved next hop's addresses into the frame it forwards
      # (BESS D-153), so the two instances' uplink frames leave with different
      # Ethernet headers -- and ci/pdrmatch-2dn.sh byte-checks them in the Dump
      # of the exit each one left by.
      value: {egress_gate: 0, dst_mac: "AgAAAAoC", src_mac: "AgAAAAoB"}
    - key: {id: 2}
      # The access side: the encap builds its own outer header, so this hop
      # names a gate and nothing else.
      value: {egress_gate: 1}
    - key: {id: 3}
      # The campus instance's exit (the peer UPF's direction), with its own L2.
      value: {egress_gate: 2, dst_mac: "AgAAAAsC", src_mac: "AgAAAAsB"}
