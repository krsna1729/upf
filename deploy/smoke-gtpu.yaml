# Smoke graph for the datapath plugin: the smallest graph that shows both
# halves of GTP-U working, with the plugin loaded from the installed bess-dev
# stage (never from BESS's source tree).
#
#   bessd -m 512 --no-huge -- -f deploy/smoke-gtpu.yaml --modules=<plugin dir>
#
# Uplink: a Source's packets are rewritten into one G-PDU frame (TEID
# 0x11223344, inner 10.0.0.1 -> 8.8.8.8/UDP), matched by the session's TEID
# rule, decapsulated by the plugin, and Dump prints the frame and the upf_teid
# the module wrote. The rule below is what makes that TEID one of ours: a
# G-PDU whose TEID no rule names is dropped by the table's default gate
# (ci/smoke-gtpu.sh checks that too).
#
# Downlink: an inner IP packet gets the session's ActionId (setattr) -- what a
# PDR rule's {gate, action_id} would deliver -- and the plugin writes the outer
# Eth/IPv4/UDP/GTP-U headers from the tunnel record that id names.
#
# Everything dynamic is a resource, not a module argument: a session change is
# one transaction over these tables, exactly as the Go controller writes it.

modules:
  # Metadata attributes are laid out in the order modules register them, and
  # the Dump module's window shows the first 16 bytes of a packet's metadata.
  # The decap declares "upf_teid" (the TEID it read) and is listed first, so
  # that window is where the smoke's metadata check looks for it; every module
  # after it may add its own.
  - name: decap0
    # mclass is the module's class name (core/module.h:761 registers #_MOD),
    # not the legacy ADD_MODULE string ("gtpu_decap").
    mclass: GtpuDecap
  - name: dump_teid
    mclass: Dump
    arg: {interval: 1}
  - name: src_up
    mclass: Source
    arg: {pkt_size: 87, burst: 1}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFAABJAAFAAEAR6ngKFB4BChQeAghoCGgANQAAMP8AJREiM0RFAAAlAAFAAEARILcKAAABCAgICATSADUAEQAAaGVsbG8tdXBm"
  - name: teid
    mclass: WildcardMatch
    arg:
      fields:
        # The outer frame's TEID: Eth (14) + IPv4 (20) + UDP (8) + the GTP-U
        # header's flags/type/length (4). One rule per session; no rule (or a
        # TEID no rule names) is what the default gate drops.
        - {offset: 46, num_bytes: 4}
  - name: mt_md
    mclass: MetadataTest
    arg:
      # The reader that makes the decap's "upf_teid" attribute real: a
      # write-only attribute no module reads gets no offset at all
      # (core/metadata.cc, FillOffsetArrays), so the writes the smoke checks
      # for would be no-ops. This module declares nothing of its own; it
      # passes packets through.
      read: {upf_teid: 4}
  - name: dump_up
    mclass: Dump
    arg: {interval: 1}
  - name: sink_up
    mclass: Sink

  # A second uplink chain whose G-PDU carries TEID 0x55667788, which no session
  # entry names: the decap must drop it, and the frame's inner source address
  # (10.0.0.2) must never appear in the log. Same frame as the first, with the
  # TEID and the inner address changed.
  - name: src_drop
    mclass: Source
    arg: {pkt_size: 87, burst: 1}
  - name: rewrite_drop
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFAABJAAFAAEAR6ngKFB4BChQeAghoCGgANQAAMP8AJVVmd4hFAAAlAAFAAEARJLoKAAACCAgEBBDhADUAEQAAaGVsbG8tdXBm"

  - name: src_down
    mclass: Source
    arg: {pkt_size: 51, burst: 1}
  - name: rewrite_down
    mclass: Rewrite
    arg:
      templates:
        # A frame, as the graph carries packets: the encap writes the outer
        # headers in front of the inner IP packet the frame holds.
        - "AgAAAAAEAgAAAAADCABFAAAlAAFAAEARILcKAAABCAgICATSADUAEQAAaGVsbG8tdXBm"
  - name: setattr_down
    mclass: SetMetadata
    arg:
      attrs:
        # 1: the ActionId of this session. A PDR rule names it and the
        # classifier writes it (BESS D-141); the tunnel table resolves it.
        - {name: "action_id", size: "4", value_int: "1"}
  - name: encap0
    mclass: GtpuEncap
    arg: {src_ip: "10.20.30.1"}
  - name: dump_down
    mclass: Dump
    arg: {interval: 1}
  - name: sink_down
    mclass: Sink

connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: teid}
  - {upstream: src_drop, downstream: rewrite_drop}
  - {upstream: rewrite_drop, downstream: teid}
  - {upstream: teid, downstream: dump_teid}
  - {upstream: dump_teid, downstream: decap0}
  - {upstream: decap0, downstream: mt_md}
  - {upstream: mt_md, downstream: dump_up}
  - {upstream: dump_up, downstream: sink_up}

  - {upstream: src_down, downstream: rewrite_down}
  - {upstream: rewrite_down, downstream: setattr_down}
  - {upstream: setattr_down, downstream: encap0}
  - {upstream: encap0, downstream: dump_down}
  - {upstream: dump_down, downstream: sink_down}

workers:
  - {wid: 0, core: 0}

resources:
  # The session's TEID, as the rule the compiler would write for it: the frame
  # is decapsulated only because this rule matches it (0x11223344 = 287454020,
  # the mask all ones). WildcardMatchRuleKey holds the values and the masks in
  # two lists, one FieldData per field, and a bytes field is base64.
  teid/rules:
    - key:
        values: [{value_bin: "ESIzRA=="}]
        masks: [{value_bin: "/////w=="}]
      value: {priority: 100, gate: 0}
  # The session's downlink path: the gNB's F-TEID and outer address, and the
  # two Ethernet addresses (base64: 02:00:00:00:00:01 and :02).
  encap0/tunnels:
    - key: {action_id: 1}
      value:
        teid: 287454020
        gnb_ip: "10.20.30.2"
        ether_src: "AgAAAAAB"
        ether_dst: "AgAAAAAC"
