# SPDX-License-Identifier: BSD-3-Clause

# Smoke graph for the datapath plugin: the smallest graph that shows both
# halves of GTP-U working, with the plugin loaded from the installed bess-dev
# stage (never from BESS's source tree).
#
#   bessd -f --mem_backing=normal --modules=<plugin dir>
#   bessctl apply deploy/smoke-gtpu.yaml && bessctl resume
#
# Uplink: Sources rewrite frames into G-PDUs, tag endpoint 1, and let
# GtpuDecap admit the complete (endpoint, outer family, local address, TEID)
# identity. The decap writes TEID, endpoint, family, address and QFI metadata;
# an unknown or control packet takes gate 2 to GtpuResponder.
#
# Downlink: an inner IP packet gets the session's ActionId (setattr) -- what a
# PDR rule's {gate, action_id} would deliver -- and the plugin writes the outer
# Eth/IPv4/UDP/GTP-U headers from the tunnel record that id names.
#
# Path management: an Echo Request (type 1, TEID 0) and the peer's Error
# Indication are control messages. Decap sends both through gate 2; the
# responder replies to echo and counts the peer's error.
#
# Everything dynamic is a resource, not a module argument: a session change is
# one transaction over these tables, exactly as the Go controller writes it.

modules:
  # Endpoint id is ingress metadata and must be present before decapsulation.
  # Every probe has its own tag, decap, responder and Dump: a Dump prints what
  # it sees when its interval comes round, so two frames sharing one would race.
  - name: tag_up
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
  # F-TEID admission is the decap's exact resource, keyed by endpoint,
  # address family, local outer address and TEID.
  - name: decap0
    mclass: GtpuDecap
  - name: src_up
    mclass: Source
    arg: {pkt_size: 95, burst: 1}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        # The same frame as before the QFI existed, with one thing added: the
        # G-PDU carries a PDU Session Container (TS 29.281's extension header
        # type 0x85, TS 38.415's contents) because that is where a real gNB
        # puts the QoS flow. The E flag (0x34) makes the four-octet optional
        # tail present, whose last octet names the container; the container's
        # length octet 0x01 covers the two content octets and its next-type
        # octet, the first content octet 0x10 is the uplink PDU type (1), and
        # the QFI 5 sits in the low six bits of the second. The three lengths
        # grew by the eight bytes (IPv4 0x51, UDP 0x3d, GTP-U 0x2d) and the
        # IPv4 checksum with them; the inner packet is byte for byte what it
        # was, so the decap's own checks below still read it.
        - "AgAAAAABAgAAAAACCABFAABRAAFAAEAR6nAKFB4CChQeAQhoCGgAPQAANP8ALREiM0QAAACFARAFAEUAACUAAUAAQBEgtwoAAAEICAgIBNIANQARAABoZWxsbw11cGY="
  - name: mt_md
    mclass: MetadataTest
    arg:
      # The reader that makes the decap's "fteid_context" attribute real: a
      # write-only attribute no module reads gets no offset at all
      # (core/metadata.cc, FillOffsetArrays), so the writes the smoke checks
      # for would be no-ops. This module declares nothing of its own; it
      # passes packets through.
      read: {endpoint_id: 4, fteid_context: 4, qfi: 1}
  - name: dump_up
    mclass: Dump
    arg: {interval: 1}
  - name: sink_up
    mclass: Sink

  # A G-PDU with TEID 0x55667788 has no admission entry, so GtpuDecap sends it
  # to gate 2 and the responder returns an Error Indication. Its inner source
  # address (10.0.0.2) must never appear in the log.
  - name: src_drop
    mclass: Source
    arg: {pkt_size: 87, burst: 1}
  - name: rewrite_drop
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFAABJAAFAAEAR6ngKFB4CChQeAQhoCGgANQAAMP8AJVVmd4hFAAAlAAFAAEARJLoKAAACCAgEBBDhADUAEQAAaGVsbG8tdXBm"
  - name: tag_drop
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
  - name: decap_drop
    mclass: GtpuDecap
  - name: resp_drop
    mclass: GtpuResponder
  - name: dump_drop
    mclass: Dump
    arg: {interval: 1}
  - name: sink_drop
    mclass: Sink

  # A third uplink frame: the same G-PDU with **no** PDU Session Container --
  # the E flag clear (octet 1's 0x34 becomes 0x30), so no optional tail and no
  # extension header, and the three lengths eight bytes shorter (IPv4 0x49,
  # UDP 0x35, GTP-U 0x25) with the IPv4 checksum moved with them. What the
  # decap writes into `qfi` for it is the check that matters: 255, the "no
  # container" value, because 0 is a real QFI (TS 38.415 5.5.3.3 ranges 0..63)
  # and a rule a PDI keys on QFI 0 must not select this packet.
  #
  # TEID 0x11223345 is a second admitted uplink F-TEID, without a PDU Session
  # Container, on its own decap and Dump.
  #
  # IPv6 unknown G-PDU: no IPv6 admission row, so it exercises the dual-stack
  # gate-2 Error Indication path and its mandatory UDP checksum.
  - name: src_drop6
    mclass: Source
    arg: {pkt_size: 90, burst: 1}
  - name: rewrite_drop6
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACht1gAAAAACQRQCABDbgAAQAAAAAAAAAAAAIgAQ24AAEAAAAAAAAAAAABCGgIaAAkUEgw/wAUVWZ3iUUAABQAAAAAAAAAAAAAAAAAAAAA"
  - name: tag_drop6
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
  - name: decap_drop6
    mclass: GtpuDecap
  - name: resp_drop6
    mclass: GtpuResponder
  - name: dump_drop6
    mclass: Dump
    arg: {interval: 1}
  - name: sink_drop6
    mclass: Sink
  - name: src_nocont
    mclass: Source
    arg: {pkt_size: 87, burst: 1}
  - name: rewrite_nocont
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFAABJAAFAAEAR6ngKFB4CChQeAQhoCGgANQAAMP8AJREiM0VFAAAlAAFAAEARILcKAAABCAgICATSADUAEQAAaGVsbG8tdXBm"
  - name: tag_nocont
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
  - name: decap_nocont
    mclass: GtpuDecap
  - name: mt_nocont
    mclass: MetadataTest
    arg:
      read: {endpoint_id: 4, fteid_context: 4, qfi: 1}
  - name: dump_nocont
    mclass: Dump
    arg: {interval: 1}
  - name: sink_nocont
    mclass: Sink

  - name: src_echo
    mclass: Source
    arg: {pkt_size: 65, burst: 1}
  - name: rewrite_echo
    mclass: Rewrite
    arg:
      templates:
        # An Echo Request (TS 29.281 7.2.1): flags 0x32 (version 1, PT 1, S 1
        # -- 5.1 sets S for an echo), type 1, TEID 0, sequence 0x1234, N-PDU
        # and next-extension-header 0, and a Recovery Time Stamp IE (type 231)
        # whose value is de ad be ef 00 00 00 00: the reply must not carry
        # that one back. 14 + 20 + 8 + 8 + 4 + 11 bytes.
        - "AgAAAAABAgAAAAACCABFAAAzAABAAEAR6o8KFB4CChQeAQhoCGgAHwAAMgEADwAAAAASNAAA5wAI3q2+7wAAAAA="
  - name: tag_echo
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
  - name: decap_echo
    mclass: GtpuDecap
  - name: echo0
    mclass: GtpuResponder
  - name: dump_echo
    mclass: Dump
    arg: {interval: 1}
  - name: sink_echo
    mclass: Sink
  # IPv6 Echo Request exercises the response path and IPv6 UDP checksum.
  - name: src_echo6
    mclass: Source
    arg: {pkt_size: 85, burst: 1}
  - name: rewrite_echo6
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACht1gAAAAAB8RQCABDbgAAQAAAAAAAAAAAAIgAQ24AAEAAAAAAAAAAAABCGgIaAAfwoYyAQAPAAAAABI0AADnAAjerb7vAAAAAA=="
  - name: tag_echo6
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
  - name: decap_echo6
    mclass: GtpuDecap
  - name: resp_echo6
    mclass: GtpuResponder
  - name: dump_echo6
    mclass: Dump
    arg: {interval: 1}
  - name: sink_echo6
    mclass: Sink

  # The peer's Error Indication (TS 29.281 7.3.1) is control traffic, not an
  # admitted G-PDU. Decap sends it to gate 2; the responder records it and sends
  # no reply.
  - name: src_err
    mclass: Source
    arg: {pkt_size: 55, burst: 1}
  - name: rewrite_err
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFAAApAAAAAEARKpoKFB4CChQeAQhoCGgAFQAAMBoABQAAAAAQVWZ3iA=="
  - name: tag_err
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
  - name: decap_err
    mclass: GtpuDecap
  - name: resp_err
    mclass: GtpuResponder
    arg: {track_errors: true}
  - name: sink_err
    mclass: Sink

  - name: src_down
    mclass: Source
    arg: {pkt_size: 51, burst: 1}
  - name: rewrite_down
    mclass: Rewrite
    arg:
      templates:
        # A frame, as the graph carries packets: the encap writes the outer
        # headers in front of the inner IP packet the frame holds.
        - "AgAAAAAEAgAAAAADCABFAAAlAAFAAEARILcKAAABCAgICATSADUAEQAAaGVsbG8tdXBm"
  - name: setattr_down
    mclass: SetMetadata
    arg:
      attrs:
        # 1: the ActionId of this session. A PDR rule names it and the
        # classifier writes it (BESS D-141); the tunnel table resolves it.
        - {name: "action_id", size: "4", value_int: "1"}
  - name: encap0
    mclass: GtpuEncap
    arg: {max_tunnels: 65536}
  - name: mt_domain
    mclass: MetadataTest
    arg: {read: {transport_route_domain: 4}}
  - name: dump_down
    mclass: Dump
    arg: {interval: 1}
  - name: sink_down
    mclass: Sink

  - name: src_down_qfi
    mclass: Source
    arg: {pkt_size: 51, burst: 1}
  - name: rewrite_down_qfi
    mclass: Rewrite
    arg:
      templates:
        # The same inner frame as the plain downlink chain: what differs is the
        # tunnel record's QFI, so the encap must write a PDU Session Container
        # (TS 38.415, extension header 0x85) into the outer header.
        - "AgAAAAAEAgAAAAADCABFAAAlAAFAAEARILcKAAABCAgICATSADUAEQAAaGVsbG8tdXBm"
  - name: setattr_down_qfi
    mclass: SetMetadata
    arg:
      attrs:
        # 2: the ActionId of a session whose QER names QFI 5.
        - {name: "action_id", size: "4", value_int: "2"}
  - name: encap_qfi
    mclass: GtpuEncap
    arg: {max_tunnels: 65536}
  - name: mt_domain_qfi
    mclass: MetadataTest
    arg: {read: {transport_route_domain: 4}}
  - name: dump_down_qfi
    mclass: Dump
    arg: {interval: 1}
  - name: sink_down_qfi
    mclass: Sink

  - name: src_down_mark
    mclass: Source
    arg: {pkt_size: 51, burst: 1}
  - name: rewrite_down_mark
    mclass: Rewrite
    arg:
      templates:
        # The plain downlink chain's inner frame with one difference: its IPv4
        # TOS is 0x02 (the ECN bits, DSCP 0), so an outer header still carrying
        # "45 02" would be the encap copying the inner class rather than
        # applying the session's Transport Level Marking (TS 29.244 8.2.42).
        - "AgAAAAAEAgAAAAADCABFAgAlAAFAAEARILUKAAABCAgICATSADUAEQAAaGVsbG8tdXBm"
  - name: setattr_down_mark
    mclass: SetMetadata
    arg:
      attrs:
        # 3: the ActionId of a session whose FAR names a Transport Level
        # Marking of DSCP EF.
        - {name: "action_id", size: "4", value_int: "3"}
  - name: encap_mark
    mclass: GtpuEncap
    arg: {max_tunnels: 65536}
  - name: mt_domain_mark
    mclass: MetadataTest
    arg: {read: {transport_route_domain: 4}}
  - name: dump_down_mark
    mclass: Dump
    arg: {interval: 1}
  - name: sink_down_mark
    mclass: Sink

connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: tag_up}
  - {upstream: tag_up, downstream: decap0}
  - {upstream: decap0, downstream: mt_md, ogate: 0}
  - {upstream: mt_md, downstream: dump_up}
  - {upstream: dump_up, downstream: sink_up}
  - {upstream: src_nocont, downstream: rewrite_nocont}
  - {upstream: rewrite_nocont, downstream: tag_nocont}
  - {upstream: tag_nocont, downstream: decap_nocont}
  - {upstream: decap_nocont, downstream: mt_nocont, ogate: 0}
  - {upstream: mt_nocont, downstream: dump_nocont}
  - {upstream: dump_nocont, downstream: sink_nocont}
  - {upstream: src_drop, downstream: rewrite_drop}
  - {upstream: rewrite_drop, downstream: tag_drop}
  - {upstream: tag_drop, downstream: decap_drop}
  - {upstream: decap_drop, downstream: resp_drop, ogate: 2}
  - {upstream: resp_drop, downstream: dump_drop}
  - {upstream: dump_drop, downstream: sink_drop}
  - {upstream: src_drop6, downstream: rewrite_drop6}
  - {upstream: rewrite_drop6, downstream: tag_drop6}
  - {upstream: tag_drop6, downstream: decap_drop6}
  - {upstream: decap_drop6, downstream: resp_drop6, ogate: 2}
  - {upstream: resp_drop6, downstream: dump_drop6}
  - {upstream: dump_drop6, downstream: sink_drop6}
  - {upstream: src_echo, downstream: rewrite_echo}
  - {upstream: rewrite_echo, downstream: tag_echo}
  - {upstream: tag_echo, downstream: decap_echo}
  - {upstream: decap_echo, downstream: echo0, ogate: 2}
  - {upstream: echo0, downstream: dump_echo}
  - {upstream: dump_echo, downstream: sink_echo}
  - {upstream: src_echo6, downstream: rewrite_echo6}
  - {upstream: rewrite_echo6, downstream: tag_echo6}
  - {upstream: tag_echo6, downstream: decap_echo6}
  - {upstream: decap_echo6, downstream: resp_echo6, ogate: 2}
  - {upstream: resp_echo6, downstream: dump_echo6}
  - {upstream: dump_echo6, downstream: sink_echo6}
  - {upstream: src_err, downstream: rewrite_err}
  - {upstream: rewrite_err, downstream: tag_err}
  - {upstream: tag_err, downstream: decap_err}
  - {upstream: decap_err, downstream: resp_err, ogate: 2}
  - {upstream: resp_err, downstream: sink_err}

  - {upstream: src_down, downstream: rewrite_down}
  - {upstream: rewrite_down, downstream: setattr_down}
  - {upstream: setattr_down, downstream: encap0}
  - {upstream: encap0, downstream: mt_domain}
  - {upstream: mt_domain, downstream: dump_down}
  - {upstream: src_down_qfi, downstream: rewrite_down_qfi}
  - {upstream: rewrite_down_qfi, downstream: setattr_down_qfi}
  - {upstream: setattr_down_qfi, downstream: encap_qfi}
  - {upstream: encap_qfi, downstream: mt_domain_qfi}
  - {upstream: mt_domain_qfi, downstream: dump_down_qfi}
  - {upstream: src_down_mark, downstream: rewrite_down_mark}
  - {upstream: rewrite_down_mark, downstream: setattr_down_mark}
  - {upstream: setattr_down_mark, downstream: encap_mark}
  - {upstream: encap_mark, downstream: mt_domain_mark}
  - {upstream: mt_domain_mark, downstream: dump_down_mark}

workers:
  - {wid: 0, core: 0}

resources:
  # Each admitting decap holds its own uplink F-TEID on endpoint 1 at
  # 10.20.30.1. The complete key is endpoint, family, local address and TEID;
  # the value's context_id is what the decap writes into fteid_context.
  # decap0's 0x0C0FFEE1 (202374881) and decap_nocont's 0x0C0FFEE2 (202374882)
  # are distinctive so the smoke can find them in the Dump output.
  decap0/fteids:
    - key: {endpoint_id: 1, address_family: 4, local_address: "ChQeAQ==", teid: 287454020}
      value: {direction: 0, context_id: 202374881}
  decap_nocont/fteids:
    - key: {endpoint_id: 1, address_family: 4, local_address: "ChQeAQ==", teid: 287454021}
      value: {direction: 0, context_id: 202374882}
  # GtpuEncap leaves Ethernet source/destination unresolved. It writes the
  # local source and peer destination for the post-encap Router.
  encap0/tunnels:
    - key: {action_id: 1}
      value:
        teid: 287454020
        local_address: "ChQeAQ=="
        peer_address: "ChQeAg=="
        transport_route_domain: 1
  # A QER that names QFI 5 adds the PDU Session Container.
  encap_qfi/tunnels:
    - key: {action_id: 2}
      value:
        teid: 287454020
        local_address: "ChQeAQ=="
        peer_address: "ChQeAg=="
        transport_route_domain: 1
        qfi: 5
        qfi_present: true
  # A session whose FAR carries a Transport Level Marking (TS 29.244 8.2.42):
  # the outer IPv4 ToS is the marking DSCP (0xb8, EF), with inner ECN bits
  # preserved by the 0xfc mask. 47356 is 0xb8fc.
  encap_mark/tunnels:
    - key: {action_id: 3}
      value:
        teid: 287454020
        local_address: "ChQeAQ=="
        peer_address: "ChQeAg=="
        transport_route_domain: 1
        marking: 47356
