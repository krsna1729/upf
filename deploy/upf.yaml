# SPDX-License-Identifier: BSD-3-Clause

# The deployed UPF graph: N3 (GTP-U toward the RAN) and N6 (plain IP toward the
# data network), with the module names cmd/upfd's flags default to. The Go
# controller writes every rule, action, meter, tunnel record and TEID rule at
# session time, in one transaction per session change; this file carries only
# what a deployment owns: the interfaces, the tables' keys, the next hops,
# the N3 address the outer headers are built from, and the reader that keeps
# the decap's session attribute real.
#
#   - deploy/smoke-gtpu.yaml  is the byte-level datapath test (Sources, no NIC).
#   - deploy/session-live.yaml is this shape without ports, for a host with no
#     bound NIC; ci/session-live.sh programs a whole session into it.
#
# The values here are the deployment's and must match upfd's flags:
#   enc's src_ip   = -n3-addr   (the UPF's N3 address; 192.0.2.1 is RFC 5737's
#                                documentation address, replace it)
#   rt/next_hops   = -n6-next-hop is the id an uplink action names (1 below),
#                    and -n3-next-hop the one a downlink action names (2
#                    below, the encap's gate). -access-next-hop is the id a
#                    forward whose FAR names Destination Interface Access
#                    leaves by whichever direction it is on (2 below as well,
#                    the encap; a deployment without uplink forwarding leaves
#                    it 0 and the downlink's own id serves). The egress_gates
#                    are this file's connections: 0 toward n6_out, 1 toward
#                    enc, and -- for the egresses a deployment adds with
#                    -instances -- 2 toward enc again (a tunnel out of an
#                    instance: N9, or indirect forwarding, hop 3) and 4 into
#                    pdr_dl (the 5G VN re-injection, hop 5). The Router's gate
#                    is interface - 1 (D-049), so hop 4 would be a service-LAN
#                    port's; this file declares none, so a deployment whose
#                    -instances names sgi-lan-next-hop adds that port and hop.
#   the N6 side    = vif_n6's one interface (the UPF's N6 MAC and address:
#                    what the data network resolves, and what its frames are
#                    addressed to) and hop 1's dst_mac, the next hop those
#                    frames name. The interface's address is the link's
#                    gateway for the UE pool.
#   the ARP proxy  = arp_n6, on the ARP branch of the N6 ingress: l2_sort
#                    sends every ARP frame there before the Vif sees it (an
#                    ARP request is addressed to the broadcast MAC, which no
#                    interface matches). Its "entries" resource holds the
#                    interface's own address and every subscriber's: upfd
#                    writes one entry per session per UE address
#                    (-instances' arp/arp-mac is the module and the MAC those
#                    replies carry), and the deployment declares the
#                    interface's own entry below. The module drops every
#                    non-ARP packet and every request it holds no entry for,
#                    so nothing but ARP may be sent to it.
# The N3 and N6 port names are the manifest's, not the driver's: a PortInc or
# PortOut names the port this file declares.

ports:
  # Two DPDK ports, bound before bessd starts (docs/ports.md). One rx queue
  # each: RSS and one worker per queue are the scale path (D-097's layout);
  # a deployment with more queues sets num_rx_queues and the workers to match.
  - name: n3
    driver: PMDPort
    arg: {port_id: 0}
    num_rx_queues: 1
  - name: n6
    driver: PMDPort
    arg: {port_id: 1}
    num_rx_queues: 1
  # The control plane's End Marker socket: no queues of its own beyond one, and
  # no PMD, so a deployment binds it without a NIC. The path is what upfd's
  # -end-marker names.
  - name: cp_marker
    driver: UnixSocketPort
    arg: {path: /tmp/upf-end-marker.sock}

modules:
  # The decap declares "upf_teid" and is listed early: attributes are laid out
  # in registration order, and the reader below makes the write real (a
  # write-only attribute gets no offset at all, core/metadata.cc).
  - name: decap0
    mclass: GtpuDecap
  - name: mt_ul_read
    mclass: MetadataTest
    arg: {read: {upf_teid: 4}}

  - name: n3_in
    mclass: PortInc
    arg: {port: n3}
  - name: n6_in
    mclass: PortInc
    arg: {port: n6}

  # The N6 ingress' first stop: every frame's EtherType, so the ARP branch is
  # taken before any interface sees the frame. An ARP request names the
  # broadcast MAC, which no Vif matches -- without this rule the request would
  # be dropped before arp_n6 (the deployment's ARP proxy, and the only answer
  # for the subscriber addresses) could read it.
  - name: l2_sort
    mclass: WildcardMatch
    arg:
      fields:
        # The frame's EtherType: Eth (12).
        - {offset: 12, num_bytes: 2}
      # Everything that is not ARP: the interface's IP frames.
      default_gate: 1
  # The ARP responder: it answers for the addresses its "entries" resource
  # holds -- the interface's own (below) and one entry per session per UE
  # address (upfd writes those with the session). It rewrites the request in
  # place into the reply and emits it on gate 0, toward the port; a request it
  # holds no entry for, and every packet that is not an ARP request, is
  # dropped. Nothing but the l2_sort rule above may send it traffic.
  - name: arp_n6
    mclass: UpfArpResponder
    arg: {max_entries: 65536}
  # The N6 port's interface. The Vif matches a frame by (VLAN, destination MAC)
  # and sends what it matched out of the interface's gate; its own ARP answer
  # is unused here, because l2_sort diverts ARP before it (arp_n6 answers for
  # the interface's address too). The interface's IP frames (the interface
  # gate) enter the downlink table. A frame that names no interface is
  # dropped, and sink_other is where that shows.
  - name: vif_n6
    mclass: Vif
    arg:
      default_gate: 0
      interfaces:
        # The deployment's N6 identity: the MAC hop 1's src_mac repeats below,
        # the address (192.0.2.2, the pool's gateway on this link), a route
        # domain for a graph whose key reads one (this file's does not, and
        # rt's max_domains is 1: domain 0 is the only one there is), and the
        # gate the interface's frames leave by.
        - {id: 1, vlan: 0, mac_addr: "02:00:00:00:06:01", ip_addr: "192.0.2.2", route_domain: 0, gate: 1}
  - name: sink_other
    mclass: Sink

  # The control plane's End Marker path (TS 29.244 5.3.2): upfd writes a whole
  # frame to this unix socket, and the port delivers it to the N3 output,
  # bypassing the rules -- a marker names a tunnel that has just been torn down,
  # so no session's rule can match it.
  - name: cp_in
    mclass: PortInc
    arg: {port: cp_marker}

  # -- ingress -----------------------------------------------------------------
  # A G-PDU arrives on N3: the TEID table is the F-TEID match (one rule per
  # session, written by the controller). Its default gate is the echo module,
  # not a drop: the only message that reaches a UPF on a TEID no session names
  # is an Echo Request (TS 29.281 7.2, TEID 0), which a peer's path management
  # needs answered. The module answers those and drops everything else, so a
  # G-PDU no session names is still dropped. Its output is the decap.
  - name: teid
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 46, num_bytes: 4}
      default_gate: 1

  - name: echo0
    mclass: GtpuEcho
    # No argument: the standard GTP-U port 2152. It declares no metadata
    # attribute, so it does not move the layout of the ones above.

  # -- the two PDR tables ------------------------------------------------------
  # Each direction has its own table, because a rule names an ActionId and a
  # table declares one actions resource (D-141): every rule's reference is
  # exact, and a direction's chain is the table's single output.
  - name: pdr_ul
    mclass: WildcardMatch
    arg:
      fields:
        # The inner frame's IPv4 5-tuple: Eth (14) + IPv4 (12/16) + L4 ports.
        - {offset: 26, num_bytes: 4}  # source address
        - {offset: 30, num_bytes: 4}  # destination address
        - {offset: 23, num_bytes: 1}  # protocol
        - {offset: 34, num_bytes: 2}  # source port
        - {offset: 36, num_bytes: 2}  # destination port
        # The QoS flow the packet belongs to, as the decap read it out of the
        # G-PDU's PDU Session Container (TS 29.244 8.2.89): what tells a
        # session's several uplink PDRs for one F-TEID apart. It is last, so the
        # fields before it keep the positions they had.
        - {attr_name: qfi, num_bytes: 1}
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports, and the QFI either named or left open
      # -- and each is one hash lookup per batch. Declared rather than
      # defaulted: it is a UPF decision. The QFI field doubles the mask shapes a
      # session's rules take (one variant per existing shape), so the number the
      # five-field list was sized for no longer covers a table with it.
      max_tuples: 16
      action_resource: at_ul/actions
  - name: pdr_dl
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports -- and each is one hash lookup per
      # batch. Declared rather than defaulted: it is a UPF decision.
      max_tuples: 8
      action_resource: at_dl/actions

  # -- the two chains ----------------------------------------------------------
  # Both directions' actions name the next hop of their FAR's destination
  # interface, and the one Router below resolves it: uplink toward N6,
  # downlink to the encap, which writes the tunnel the same action names. A
  # chain whose action names no next hop would be dropped wholesale -- the
  # ActionTable fails closed when the id it writes has no reader -- so the
  # downlink does not go straight from the table to the encap. Meters are
  # per-chain for the same reason the tables are.
  # The capacities are the id spaces the session compiler's config names: the
  # Meter and ActionTable defaults are 1024 each, and a session whose meter id
  # is beyond the capacity is refused as an invalid id. A deployment that wants
  # a different number changes it here and in upfd's -capacity together.
  - name: at_ul
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_ul/meters, next_hops: rt/next_hops}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  # The hop count is the chain's, before the router resolves anything: the
  # uplink's decrement is the UE's own (RFC 791; RFC 1122 3.2.1.7: decrement,
  # and drop at 1). The module has no ICMP Time Exceeded and keeps nothing but
  # its gate counters, so that drop is silent -- recorded in docs/datapath.md
  # and docs/compliance.md.
  - name: ttl_ul
    mclass: UpdateTTL
  - name: at_dl
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_dl/meters, next_hops: rt/next_hops}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  # The downlink's decrement: the data network's hop count. The outer headers
  # the encap builds after it are the tunnel's and carry the encap's own.
  - name: ttl_dl
    mclass: UpdateTTL

  - name: rt
    mclass: Router
  - name: enc
    mclass: GtpuEncap
    arg: {src_ip: "192.0.2.1", max_tunnels: 65536}

  # -- egress ------------------------------------------------------------------
  - name: n6_out
    mclass: PortOut
    arg: {port: n6}
  - name: n3_out
    mclass: PortOut
    arg: {port: n3}

connections:
  - {upstream: n3_in, downstream: teid}
  - {upstream: teid, downstream: decap0}
  # The table's default gate (ogate 1): the echo module's reply leaves on the
  # N3 port it arrived on, which is where a peer's path management listens.
  - {upstream: teid, downstream: echo0, ogate: 1}
  - {upstream: echo0, downstream: n3_out}
  - {upstream: decap0, downstream: mt_ul_read}
  - {upstream: mt_ul_read, downstream: pdr_ul}
  - {upstream: pdr_ul, downstream: at_ul}
  - {upstream: at_ul, downstream: mt_ul}
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: cnt_ul, downstream: ttl_ul}
  - {upstream: ttl_ul, downstream: rt}
  - {upstream: rt, downstream: n6_out}

  # The N6 port's ingress: l2_sort first, so ARP reaches arp_n6 (whose reply
  # leaves the port) and everything else reaches the interface. What the
  # interface matched enters the downlink table; what it did not is dropped in
  # sink_other. Three producers reach n6_out, and a PortOut takes them all.
  - {upstream: n6_in, downstream: l2_sort}
  - {upstream: l2_sort, downstream: arp_n6}
  - {upstream: arp_n6, downstream: n6_out}
  - {upstream: l2_sort, downstream: vif_n6, ogate: 1}
  - {upstream: vif_n6, downstream: pdr_dl, ogate: 1}
  - {upstream: vif_n6, downstream: sink_other}

  - {upstream: pdr_dl, downstream: at_dl}
  - {upstream: at_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: cnt_dl, downstream: ttl_dl}
  - {upstream: ttl_dl, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  # The egresses an instance's forwards take beyond the data network: a tunnel
  # out of the instance (N9, or the indirect-forwarding tunnel of an uplink
  # forward, hop 3) and the 5G VN re-injection, which puts the packet back into
  # the subscriber-side chain (hop 5). Both are one hop id an action names; the
  # connections are what give that id a gate.
  - {upstream: rt, downstream: enc, ogate: 2}
  - {upstream: rt, downstream: pdr_dl, ogate: 4}
  - {upstream: enc, downstream: n3_out}
  # The marker leaves on the same N3 port a downlink packet would, which is
  # where the peer that must read it is listening.
  - {upstream: cp_in, downstream: n3_out}

resources:
  # The actions' next hops: the deployment's, not a session's (a session's
  # action names the next hops by id). One hop per direction's egress; a
  # deployment with several N3 ports gives each its own, and one that wants
  # prefix routing instead of pre-resolved actions uses IPLookup's routes --
  # a Router's routes table is never consulted when the action names a hop.
  # Hop 1 is the N6 side (base64: 02:00:00:00:06:02, the data network's next
  # hop, and 02:00:00:00:06:01, vif_n6's interface): the Router writes those
  # addresses into every frame it resolves the hop for (BESS D-153). Hop 2
  # has none: the encap builds that frame's own.
  # Hop 3 is a tunnel out of a network instance and hop 5 is the 5G VN
  # re-injection: both leave by the encap and the downlink table respectively,
  # and upfd names them from -instances' tunnel-next-hop and vn-next-hop. A
  # deployment that does not serve those values declares neither.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0, dst_mac: "AgAAAAYC", src_mac: "AgAAAAYB"}
    - key: {id: 2}
      value: {egress_gate: 1}
    - key: {id: 3}
      value: {egress_gate: 2}
    - key: {id: 5}
      value: {egress_gate: 4}

  # l2_sort's one rule: ARP (0x0806) is the responder's. Everything else is
  # the interface's (the table's default gate, 1).
  l2_sort/rules:
    - key:
        values: [{value_bin: "CAY="}]
        masks: [{value_bin: "//8="}]
      value: {priority: 100, gate: 0}

  # The ARP proxy's own entry: the interface's address, so the data network can
  # resolve the link's gateway even before a session exists. The subscriber
  # entries are upfd's, one per session per UE address, and they are claimed
  # and erased with the session; this one is the deployment's and stays.
  arp_n6/entries:
    - key: {ip: "192.0.2.2"}
      value: {mac_addr: "02:00:00:00:06:01"}
