# SPDX-License-Identifier: BSD-3-Clause

# deploy/session-path.yaml with BESS's own `firewall` module in place of both
# PDR tables (the generic profile's other matching strategy: `upfd
# -firewall-ul fw_ul -firewall-dl fw_dl`). Every lane that runs on that graph
# runs on this one (`FIREWALL=1 ci/session-path.sh`), so the rules a PDR
# compiles to -- carrying the PDR's ActionId -- are shown to select the action,
# the meter, the counter and the tunnel, through a stock module.
#
# uplink    src_up -> rewrite_up -> set_n3_endpoint -> decap0 -> fw_ul -> mt_ul -> cnt_ul -> rt -> merge_n6 -> dump_n6 -> sink_n6
# downlink  src_dn -> rewrite_dn -> vif_n6 -> l2_sort -> fw_dl -> mt_dl -> cnt_dl -> rt -> enc -> dump_d -> sink_n3
#
# A third, idle path is the control plane's own: the unix_port cp_marker (the
# port `upfd -end-marker` writes to) delivers an End Marker packet
# (TS 29.244 5.3.2) to a sink, where ci/session-path.sh reads it out of the
# daemon's log. Nothing of a session's traffic passes through it.
#
# Nothing here is a session: the Go controller writes every rule, action,
# meter, counter, tunnel and endpoint-scoped F-TEID resource. The live session
# test verifies known uplink/downlink packets enter their directional classifiers.
#
# The two Sources send continuously from the moment the graph is applied, so a
# sink's counter is zero exactly when no session selects those packets: that is
# the control arm, and it is why the packets are evidence rather than a picture.
# They send in bursts of 32 so the *chains* set the rate rather than the
# generator's one-packet-per-iteration loop (ci/bench-graph.sh measures it).
#
# The frames are the ones the compiler's session makes match:
#   uplink    G-PDU to TEID 0x11223344 (the F-TEID the session's SMF pins),
#             holding the UE's packet 10.45.0.2:5000 -> 8.8.8.8:53
#   downlink  the data network's answer 8.8.8.8:5000 -> 10.45.0.2:53, marked
#             EF (TOS 0xb8, DSCP 46), which the downlink PDR matches ("to
#             assigned 53"), the FAR's outer header creation (TEID 0x55667788
#             toward the gNB) puts GTP-U around, and the encap's DSCP copy
#             carries onto the outer header. It is addressed to the N6
#             interface's MAC, the deployment's own pair.
#
# The N6 side (vif_n6, l2_sort, sink_other, merge_n6, dump_n6) and the TTL
# modules are deploy/session-path.yaml's, unchanged: that file carries the
# comments. This file's difference is the two tables.
#
# Metadata attributes are laid out in module registration order. MetadataTest
# declares all GtpuDecap-written fields so they receive storage.

ports:
  # The control plane's marker port: a unix socket (SOCK_SEQPACKET) that the
  # controller writes whole End Marker frames to. BESS unlinks the path when it
  # binds, so a run that died leaves nothing behind for the next one.
  - name: cp_marker
    driver: UnixSocketPort
    arg: {path: /tmp/upf-end-marker.sock}

modules:
  # The peer's GTP-U Error Indication (TS 29.281 7.3.1): type 26, header TEID
  # 0, and the TEID IE naming the tunnel it cannot reach -- the one this
  # session's downlink FAR sends with (0x55667788, pathDownTEID in the live
  # test). GtpuDecap routes unknown valid GPDU/control traffic on gate 2 here.
  # The responder records received Error Indications and notifies the SMF
  - name: echo_err
    mclass: GtpuResponder
    arg: {track_errors: true}
  - name: src_err
    mclass: Source
    arg: {pkt_size: 55, burst: 1}
  - name: rewrite_err
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFAAApAAAAAEARKpoKFB4CChQeAQhoCGgAFQAAMBoABQAAAAAQVWZ3iA=="

  - name: decap0
    mclass: GtpuDecap
  - name: mt_md
    mclass: MetadataTest
    arg:
      read: {endpoint_id: 4, fteid_context: 4, qfi: 1}
  - name: dump_u
    mclass: Dump
    arg: {interval: 1}
  - name: src_up
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABJAAFAAEARUIwKFB4CwAACAQhoCGgANQAAMP8AJREiM0RFAAAlAAFAAEARIIkKLQACCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: set_n3_endpoint
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
        - {name: route_domain, size: 4, value_int: 0}
        - {name: transport_route_domain, size: 4, value_int: 1}
  # The stock firewall in place of the WildcardMatch table: its policy is one
  # ordered rule list (the compiler writes every live session's rules of this
  # direction), a rule names its PDR's ActionId, and the rule result behind it
  # resolves the meter, the next hop and the tunnel from it.
  - name: fw_ul
    mclass: Firewall
    arg:
      result_fields:
        - {attr_name: meter_id, value_offset: 0, num_bytes: 8, reference: mt_ul/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 8, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 12, num_bytes: 4}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: rt
    mclass: Router
  # The port: the router's frames and the interface's own meet here.
  - name: merge_n6
    mclass: Merge
  - name: dump_n6
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n6
    mclass: Sink

  - name: src_dn
    mclass: Source
    arg: {pkt_size: 51, burst: 32}
  - name: rewrite_dn
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAYBAgAAAAYCCABFuAAlAAFAAEARH9EICAgICi0AAhOIADUAEQAAaGVsbG8tdXBm"
  # The N6 port's interface and the port's merge, as deploy/session-path.yaml
  # wires them (that file carries the comments).
  - name: vif_n6
    mclass: Vif
    arg:
      default_gate: 0
      interfaces:
        - {id: 1, vlan: 0, mac_addr: "02:00:00:00:06:01", ip_addr: "192.0.2.2", route_domain: 0, gate: 1}
  - name: l2_sort
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 12, num_bytes: 2}
      default_gate: 1
  - name: sink_other
    mclass: Sink
  # The stock firewall in place of the WildcardMatch table: its policy is one
  # ordered rule list (the compiler writes every live session's rules of this
  # direction), a rule names its PDR's ActionId, and the rule result behind it
  # resolves the meter, the next hop and the tunnel from it.
  - name: fw_dl
    mclass: Firewall
    arg:
      result_fields:
        - {attr_name: meter_id, value_offset: 0, num_bytes: 8, reference: mt_dl/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 8, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 12, num_bytes: 4}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: enc
    mclass: GtpuEncap
    arg: {max_tunnels: 65536}
  - name: mt_transport
    mclass: MetadataTest
    arg: {read: {transport_route_domain: 4}}
  - name: dump_d
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n3
    mclass: Sink

  # The control plane's End Marker path: the port a controller writes a marker
  # to, a dump the arm reads it from, and a sink. The port is SOCK_SEQPACKET
  # (unix_socket.cc), so one write is one packet.
  - name: cp_in
    mclass: PortInc
    arg: {port: cp_marker}
  - name: dump_m
    mclass: Dump
    arg: {interval: 1}
  - name: sink_m
    mclass: Sink

connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: set_n3_endpoint}
  - {upstream: set_n3_endpoint, downstream: decap0}
  - {upstream: src_err, downstream: rewrite_err}
  - {upstream: rewrite_err, downstream: set_n3_endpoint}
  - {upstream: decap0, downstream: mt_md, ogate: 0}
  - {upstream: decap0, downstream: fw_dl, ogate: 1}
  - {upstream: decap0, downstream: echo_err, ogate: 2}
  - {upstream: mt_md, downstream: dump_u}
  - {upstream: dump_u, downstream: fw_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: rt}
  - {upstream: rt, downstream: merge_n6}
  - {upstream: merge_n6, downstream: dump_n6}
  - {upstream: dump_n6, downstream: sink_n6}

  - {upstream: src_dn, downstream: rewrite_dn}
  - {upstream: rewrite_dn, downstream: vif_n6}
  - {upstream: vif_n6, downstream: l2_sort, ogate: 1}
  - {upstream: l2_sort, downstream: fw_dl, ogate: 1}
  - {upstream: l2_sort, downstream: merge_n6}
  - {upstream: vif_n6, downstream: sink_other}
  - {upstream: fw_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: mt_transport}
  - {upstream: mt_transport, downstream: dump_d}
  - {upstream: dump_d, downstream: sink_n3}

  # The control plane's markers: the port's packets go straight to the dump,
  # never through a rule -- an End Marker is not session traffic.
  - {upstream: cp_in, downstream: dump_m}
  - {upstream: dump_m, downstream: sink_m}

workers:
  - {wid: 0, core: 0}

resources:
  # The actions' next hops: the deployment's, not a session's (a session's
  # action names them by id). Every chain's result writes the next hop
  # it writes -- the module fails closed when the attribute has no reader -- so
  # both directions have one: the uplink's leaves by gate 0 toward N6, the
  # downlink's by gate 1 toward the encap. A `Router`'s `routes` table is not on
  # this path: an action that names a next hop has already resolved it, and the
  # table is for a deployment that wants prefix routing instead (module
  # `IPLookup`, whose routes are gate-valued and are looked up per packet).
  # Hop 1's N6 MACs are deploy/session-path.yaml's; the lane's N6 check reads
  # them.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0, dst_mac: "AgAAAAYC", src_mac: "AgAAAAYB"}
    - key: {id: 2}
      value: {egress_gate: 1}

  # As in deploy/session-path.yaml: the Vif's ARP answer leaves by the port.
  l2_sort/rules:
    - key: {fields: [{value_bin: "CAY="}]}
      value: {gate: 0}
