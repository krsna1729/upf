# SPDX-License-Identifier: BSD-3-Clause

# The keyed per-session matcher's own graph: deploy/session-path.yaml with the
# uplink's PDR table replaced by this tree's module (`PdrMatch`, docs/design.md
# "the keyed write"). Everything else is that graph's, so the two can be read
# side by side and the one difference is the thing under test.
#
# uplink    src_up -> rewrite_up -> teid -> decap0 -> pdr_match_ul -> at_ul -> mt_ul -> cnt_ul -> rt -> dump_n6 -> sink_n6
# downlink  src_dn -> rewrite_dn -> pdr_dl -> at_dl -> mt_dl -> cnt_dl -> rt -> enc -> dump_d -> sink_n3
#
# The uplink chain is the claim: `pdr_match_ul` is the only module that reads
# the decapsulated packet's 5-tuple (there is no WildcardMatch in the chain,
# `pdr_ul` is not in this graph at all), so a packet that leaves this graph
# toward N6 was matched *by the module*, out of the session's own rules -- the
# map `PdrMatch` holds, keyed by the F-TEID the decap wrote to `upf_teid`, one
# key per session. What the module hands downstream is the rule's ActionId in
# the packet's `action_id` metadata (BESS D-141), exactly what the WildcardMatch
# path hands it: `at_ul` reads that id, the meter passes the packet, and the
# router leaves by the next hop the action names.
#
# Nothing here is a session. `ci/pdrmatch-path.sh` establishes one over the
# control plane with the compiler's `PdrMatch` opt-in -- one upsert of the
# session's rules under the key 0x11223344 -- and the graph's own Source runs
# from the moment it is applied, so a zero before the session and packets after
# it are the control arm and its evidence.
#
# The frames are deploy/session-path.yaml's, byte for byte:
#   uplink    G-PDU to TEID 0x11223344 (the F-TEID the session pins), holding
#             the UE's packet 10.45.0.2:5000 -> 8.8.8.8:53, which is the packet
#             the session's uplink PDR is a rule about
#             ("permit out udp from any to assigned 53": the UE's address from
#             the PDI, protocol 17 and destination port 53 from the filter)
#   downlink  the data network's answer 8.8.8.8:5000 -> 10.45.0.2:53, which the
#             downlink PDR matches on the WildcardMatch path (this arm does not
#             build the downlink selector, so that direction is unchanged)
#
# Metadata attributes are laid out in module registration order, so decap0 --
# which writes "upf_teid" -- is listed first and `pdr_match_ul`, which reads it
# as its key, follows it; the same order gives "action_id" its writer before the
# modules that read it. A write-only attribute no module reads gets no offset
# (core/metadata.cc), and the module drops a packet whose key has none.

# No port: the uplink and downlink frames come from the graph's own Sources,
# and this arm sends no End Marker (that port belongs to session-path.yaml).
ports: []

modules:
  - name: decap0
    mclass: GtpuDecap
  # The matcher: one key per session ("<module>/rules"), the key being the
  # F-TEID the decap below wrote. max_sessions sizes the map, which is
  # allocated once and never resized.
  - name: pdr_match_ul
    mclass: PdrMatch
    arg: {key_attr: upf_teid, max_sessions: 65536}
  - name: dump_u
    mclass: Dump
    arg: {interval: 1}
  - name: src_up
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABJAAFAAEARUIwKFB4CwAACAQhoCGgANQAAMP8AJREiM0RFAAAlAAFAAEARIIkKLQACCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: teid
    mclass: WildcardMatch
    arg:
      fields:
        # The G-PDU's TEID: Eth (14) + IPv4 (20) + UDP (8) + the GTP-U header's
        # flags, type and length (4). One rule per session; a TEID no rule
        # names is dropped by the default gate.
        - {offset: 46, num_bytes: 4}
  - name: at_ul
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_ul/meters, next_hops: rt/next_hops}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: rt
    mclass: Router
  # The uplink's own egress: a Dump on the router's N6 gate, so what is checked
  # is the packet that left the graph toward N6 rather than one that entered it.
  - name: dump_n6
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n6
    mclass: Sink

  - name: src_dn
    mclass: Source
    arg: {pkt_size: 51, burst: 32}
  - name: rewrite_dn
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFuAAlAAFAAEARH9EICAgICi0AAhOIADUAEQAAaGVsbG8tdXBm"
  - name: pdr_dl
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
      max_tuples: 8
      action_resource: at_dl/actions
  - name: at_dl
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_dl/meters, next_hops: rt/next_hops}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: enc
    mclass: GtpuEncap
    arg: {src_ip: "192.0.2.1", max_tunnels: 65536}
  - name: dump_d
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n3
    mclass: Sink

connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: teid}
  - {upstream: teid, downstream: decap0}
  - {upstream: decap0, downstream: dump_u}
  - {upstream: dump_u, downstream: pdr_match_ul}
  - {upstream: pdr_match_ul, downstream: at_ul}
  - {upstream: at_ul, downstream: mt_ul}
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: cnt_ul, downstream: rt}
  - {upstream: rt, downstream: dump_n6, ogate: 0}
  - {upstream: dump_n6, downstream: sink_n6}

  - {upstream: src_dn, downstream: rewrite_dn}
  - {upstream: rewrite_dn, downstream: pdr_dl}
  - {upstream: pdr_dl, downstream: at_dl}
  - {upstream: at_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: cnt_dl, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: dump_d}
  - {upstream: dump_d, downstream: sink_n3}

workers:
  - {wid: 0, core: 0}

resources:
  # The actions' next hops, as in deploy/session-path.yaml: id 1 is the uplink's
  # N6 route (gate 0) and id 2 the downlink's N3 one (gate 1). The compiler
  # names them, not the session.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0}
    - key: {id: 2}
      value: {egress_gate: 1}
