# SPDX-License-Identifier: BSD-3-Clause

# The keyed per-session matcher's own graph: deploy/session-path.yaml with the
# uplink's PDR table replaced by this tree's module (`PdrMatch`, docs/design.md
# "the keyed write"). Everything else is that graph's, so the two can be read
# side by side and the one difference is the thing under test.
#
# uplink    src_up -> rewrite_up -> teid -> decap0 -> pdr_match_ul -> mt_ul -> cnt_ul -> rt -> merge_n6 -> dump_n6 -> sink_n6
# downlink  src_dn -> rewrite_dn -> vif_n6 -> l2_sort -> sel_dl -> pdr_match_dl -> mt_dl -> cnt_dl -> rt -> enc -> dump_d -> sink_n3
#
# The uplink chain is the claim: `pdr_match_ul` is the only module that reads
# the decapsulated packet's 5-tuple (there is no WildcardMatch in the chain,
# `pdr_ul` is not in this graph at all), so a packet that leaves this graph
# toward N6 was matched *by the module*, out of the session's own rules -- the
# map `PdrMatch` holds, keyed by the F-TEID the decap wrote to `upf_teid`, one
# key per session. What the module hands downstream is the rule's ActionId in
# the packet's `action_id` metadata (BESS D-141), exactly what the WildcardMatch
# path hands it: the rule result writes the meter ids and the next hop, the
# meter passes the packet, and the router leaves by that next hop.
#
# Nothing here is a session. `ci/pdrmatch-path.sh` establishes one over the
# control plane with the compiler's `PdrMatch` opt-in -- one upsert of the
# session's rules under the key 0x11223344 -- and the graph's own Source runs
# from the moment it is applied, so a zero before the session and packets after
# it are the control arm and its evidence.
#
# The frames are deploy/session-path.yaml's, byte for byte:
#   uplink    G-PDU to TEID 0x11223344 (the F-TEID the session pins), holding
#             the UE's packet 10.45.0.2:5000 -> 8.8.8.8:53, which is the packet
#             the session's uplink PDR is a rule about
#             ("permit out udp from any to assigned 53": the UE's address from
#             the PDI, protocol 17 and destination port 53 from the filter)
#   downlink  the data network's answer 8.8.8.8:5000 -> 10.45.0.2:53, which the
#             downlink PDR matches on the WildcardMatch path (this arm does not
#             build the downlink selector, so that direction is unchanged). It
#             is addressed to the N6 interface's MAC, the deployment's own
#             pair, as in deploy/session-path.yaml.
#
# The N6 side (vif_n6, l2_sort, sink_other, merge_n6, dump_n6) and the TTL
# modules are deploy/session-path.yaml's, unchanged: that file carries the
# comments.
#
# Metadata attributes are laid out in module registration order, so decap0 --
# which writes "upf_teid" -- is listed first and `pdr_match_ul`, which reads it
# as its key, follows it; the same order gives "action_id" its writer before the
# modules that read it. A write-only attribute no module reads gets no offset
# (core/metadata.cc), and the module drops a packet whose key has none.

# The uplink and downlink frames come from the graph's own Sources. The one
# port is the control plane's End Marker socket, as in deploy/session-path.yaml
# (this graph is that one with the uplink's table replaced, so every lane that
# runs on one runs on the other): a unix socket (SOCK_SEQPACKET) the controller
# writes whole End Marker frames to. BESS unlinks the path when it binds.
ports:
  - name: cp_marker
    driver: UnixSocketPort
    arg: {path: /tmp/upf-end-marker.sock}

modules:
  # The peer's GTP-U Error Indication (TS 29.281 7.3.1): type 26, header TEID
  # 0, and the TEID IE naming the tunnel it cannot reach -- the one this
  # session's downlink FAR sends with (0x55667788, pathDownTEID in the live
  # test). It takes the rule table's default gate, the responder behind it
  # records the count (its track_errors argument), and the SMF hears about it
  # as an Error Indication Report (TS 29.244 5.10).
  - name: echo_err
    mclass: GtpuResponder
    arg: {track_errors: true}
  - name: src_err
    mclass: Source
    arg: {pkt_size: 55, burst: 1}
  - name: rewrite_err
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFAAApAAAAAEARKpoKFB4CChQeAQhoCGgAFQAAMBoABQAAAAAQVWZ3iA=="

  - name: decap0
    mclass: GtpuDecap
  # The matcher: one key per session ("<module>/rules"), the key being the
  # F-TEID the decap below wrote. max_sessions sizes the map, which is
  # allocated once and never resized.
  - name: pdr_match_ul
    mclass: PdrMatch
    arg: {key_attr: upf_teid, max_sessions: 65536, meter_attr: meter_id, next_hop_attr: next_hop_id}
  - name: dump_u
    mclass: Dump
    arg: {interval: 1}
  - name: src_up
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABJAAFAAEARUIwKFB4CwAACAQhoCGgANQAAMP8AJREiM0RFAAAlAAFAAEARIIkKLQACCAgICBOIADUAEQAAaGVsbG8tdXBm"

  # Two more uplink streams on the same tunnel, each a G-PDU carrying a PDU
  # Session Container (TS 38.415): QFI 5 and QFI 9, payloads "qfi5-upf!" and
  # "qfi9-upf!". They start idle (burst 0): ci/pdrmatch runs one stream at a
  # time, so a Dump's one-packet-a-second sample is that stream's.
  - name: src_q5
    mclass: Source
    arg: {pkt_size: 95, burst: 0}
  - name: rewrite_q5
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABRAAFAAEARUIQKFB4CwAACAQhoCGgAPQAANP8ALREiM0QAAACFARAFAEUAACUAAUAAQBEgiQotAAIICAgIE4gANQARAABxZmk1LXVwZiE="
  - name: src_q9
    mclass: Source
    arg: {pkt_size: 95, burst: 0}
  - name: rewrite_q9
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABRAAFAAEARUIQKFB4CwAACAQhoCGgAPQAANP8ALREiM0QAAACFARAJAEUAACUAAUAAQBEgiQotAAIICAgIE4gANQARAABxZmk5LXVwZiE="
  - name: teid
    mclass: WildcardMatch
    arg:
      fields:
        # The G-PDU's TEID: Eth (14) + IPv4 (20) + UDP (8) + the GTP-U header's
        # flags, type and length (4). One rule per session; a TEID no rule
        # names takes the default gate, whose responder answers a G-PDU for a
        # tunnel this node does not have with an Error Indication (7.3.1) and
        # records the Error Indications the peer sends (5.10).
        - {offset: 46, num_bytes: 4}
      default_gate: 1
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: rt
    mclass: Router
  # The port: the router's frames and the interface's own meet here.
  - name: merge_n6
    mclass: Merge
  # The uplink's own egress: a Dump on the router's N6 gate, so what is checked
  # is the packet that left the graph toward N6 rather than one that entered it.
  - name: dump_n6
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n6
    mclass: Sink

  - name: src_dn
    mclass: Source
    arg: {pkt_size: 51, burst: 32}
  - name: rewrite_dn
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAYBAgAAAAYCCABFuAAlAAFAAEARH9EICAgICi0AAhOIADUAEQAAaGVsbG8tdXBm"
  # The N6 port's interface and the port's merge, as deploy/session-path.yaml
  # wires them (that file carries the comments).
  - name: vif_n6
    mclass: Vif
    arg:
      default_gate: 0
      interfaces:
        - {id: 1, vlan: 0, mac_addr: "02:00:00:00:06:01", ip_addr: "192.0.2.2", route_domain: 1, gate: 1}
  - name: l2_sort
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 12, num_bytes: 2}
      default_gate: 1
  - name: sink_other
    mclass: Sink
  # The downlink's selector and matcher, as deploy/custom-pdrmatch.yaml wires
  # them: a packet from the data network carries no tunnel, so the session it
  # belongs to is the one whose UE address it is addressed to. The selector
  # names it -- one rule per (route domain, UE address), whose value is the
  # session id, written into the packet's `action_id` metadata -- and the
  # matcher reads that id as its key. sel_at holds the action record each rule
  # references (BESS validates a rule's action id as a reference), and is never
  # in the packet path.
  - name: sel_dl
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 30, num_bytes: 4}
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
  - name: pdr_match_dl
    mclass: PdrMatch
    arg: {key_attr: action_id, max_sessions: 65536, meter_attr: meter_id, next_hop_attr: next_hop_id}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: enc
    mclass: GtpuEncap
    arg: {src_ip: "192.0.2.1", max_tunnels: 65536}
  - name: dump_d
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n3
    mclass: Sink

  # The End Marker's path (TS 29.244 5.3.2): idle but for the marker, which a
  # Dump shows in the daemon's log.
  - name: cp_in
    mclass: PortInc
    arg: {port: cp_marker}
  - name: dump_m
    mclass: Dump
    arg: {interval: 1}
  - name: sink_m
    mclass: Sink

connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: teid}
  - {upstream: src_q5, downstream: rewrite_q5}
  - {upstream: rewrite_q5, downstream: teid}
  - {upstream: src_q9, downstream: rewrite_q9}
  - {upstream: rewrite_q9, downstream: teid}
  - {upstream: teid, downstream: decap0}
  - {upstream: teid, downstream: echo_err, ogate: 1}
  - {upstream: src_err, downstream: rewrite_err}
  - {upstream: rewrite_err, downstream: teid}
  - {upstream: decap0, downstream: dump_u}
  - {upstream: dump_u, downstream: pdr_match_ul}
  - {upstream: pdr_match_ul, downstream: mt_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: rt}
  - {upstream: rt, downstream: merge_n6, ogate: 0}
  - {upstream: merge_n6, downstream: dump_n6}
  - {upstream: dump_n6, downstream: sink_n6}

  - {upstream: src_dn, downstream: rewrite_dn}
  - {upstream: rewrite_dn, downstream: vif_n6}
  - {upstream: vif_n6, downstream: l2_sort, ogate: 1}
  - {upstream: l2_sort, downstream: sel_dl, ogate: 1}
  - {upstream: l2_sort, downstream: merge_n6}
  - {upstream: vif_n6, downstream: sink_other}
  - {upstream: sel_dl, downstream: pdr_match_dl}
  - {upstream: pdr_match_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: dump_d}
  - {upstream: dump_d, downstream: sink_n3}

  - {upstream: cp_in, downstream: dump_m}
  - {upstream: dump_m, downstream: sink_m}

workers:
  - {wid: 0, core: 0}

resources:
  # The actions' next hops, as in deploy/session-path.yaml: id 1 is the uplink's
  # N6 route (gate 0) and id 2 the downlink's N3 one (gate 1). The compiler
  # names them, not the session; hop 1 carries that file's N6 MACs too.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0, dst_mac: "AgAAAAYC", src_mac: "AgAAAAYB"}
    - key: {id: 2}
      value: {egress_gate: 1}

  # As in deploy/session-path.yaml: the Vif's ARP answer leaves by the port.
  l2_sort/rules:
    - key:
        values: [{value_bin: "CAY="}]
        masks: [{value_bin: "//8="}]
      value: {priority: 100, gate: 0}
