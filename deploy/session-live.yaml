# The live graph for the session layer's own test (ci/session-live.sh): the
# module names internal/session's Config names, with no session in it. The Go
# compiler writes every rule, action, meter, tunnel and TEID rule, and the test
# asserts the daemon accepts a whole session as one transaction.
#
# Packets are not the point here (deploy/smoke-gtpu.yaml proves the datapath);
# the graph exists so the resources are real and their references resolve: the
# PDR, action, meter and TEID tables the compiler writes, and the next hop its
# uplink actions name.
#
# Metadata attributes are laid out in module registration order, so the module
# whose attribute the test inspects is listed first.
modules:
  - name: decap0
    mclass: GtpuDecap
  - name: teid
    mclass: WildcardMatch
    arg:
      fields:
        # The G-PDU's TEID: Eth (14) + IPv4 (20) + UDP (8) + the GTP-U header's
        # flags, type and length (4).
        - {offset: 46, num_bytes: 4}
  - name: pdr_ul
    mclass: WildcardMatch
    arg:
      fields:
        # The inner frame's IPv4 5-tuple: Eth (14) + IPv4 (12/16) + L4 ports.
        - {offset: 26, num_bytes: 4}  # source address
        - {offset: 30, num_bytes: 4}  # destination address
        - {offset: 23, num_bytes: 1}  # protocol
        - {offset: 34, num_bytes: 2}  # source port
        - {offset: 36, num_bytes: 2}  # destination port
      # One table per direction, because a rule names an ActionId and a table
      # declares one actions resource (D-141): every rule's reference is then
      # exact, and the rule's gate picks nothing -- its table has one chain.
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports -- and each is one hash lookup per
      # batch. Declared rather than defaulted: it is a UPF decision.
      max_tuples: 8
      action_resource: at_ul/actions
  - name: pdr_dl
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports -- and each is one hash lookup per
      # batch. Declared rather than defaulted: it is a UPF decision.
      max_tuples: 8
      action_resource: at_dl/actions
  - name: at_ul
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_ul/meters, next_hops: rt/next_hops}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536}
  - name: at_dl
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_dl/meters, next_hops: rt/next_hops}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536}
  - name: rt
    mclass: Router
  - name: enc
    mclass: GtpuEncap
    arg: {src_ip: "192.0.2.1", max_tunnels: 65536}
  - name: sink
    mclass: Sink

connections:
  - {upstream: teid, downstream: decap0}
  - {upstream: decap0, downstream: pdr_ul}
  - {upstream: pdr_ul, downstream: at_ul}
  - {upstream: at_ul, downstream: mt_ul}
  - {upstream: mt_ul, downstream: rt}
  - {upstream: pdr_dl, downstream: at_dl}
  - {upstream: at_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: sink}

resources:
  # The actions' next hops: the deployment's, not a session's (a session's
  # action names them by id). Both directions' actions name one, because both
  # chains hold an ActionTable and the module fails closed when the id it writes
  # has no reader.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0}
    - key: {id: 2}
      value: {egress_gate: 1}
