# SPDX-License-Identifier: BSD-3-Clause

# The live graph for the session layer's own test (`ci/session-live.sh`): the
# module names `internal/session` configures, with no session installed. The Go
# compiler writes each session's F-TEID admission entry, PDR rule, action,
# meter, counter and tunnel record in one transaction.
#
# Packets are not the point here (`deploy/smoke-gtpu.yaml` proves the datapath);
# this graph makes the resources real and their references resolvable, so the
# test can program and remove a whole session through the control plane.
#
# Metadata attributes are laid out in module registration order, so the module
# whose attribute the test inspects is listed first.
modules:
  - name: decap0
    mclass: GtpuDecap
  - name: mt_md
    mclass: MetadataTest
    arg:
      read: {endpoint_id: 4, fteid_context: 4, qfi: 1}
  - name: pdr_ul
    mclass: WildcardMatch
    arg:
      fields:
        # The inner frame's IPv4 5-tuple: Eth (14) + IPv4 (12/16) + L4 ports.
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
        - {attr_name: fteid_context, num_bytes: 4}
        - {attr_name: qfi, num_bytes: 1}
      # One table per direction, with a result schema for that direction's
      # meters and route fields. A hit writes the result directly to packet
      # metadata; the table has one output chain.
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports, and the QFI either named or left open
      # -- and each is one hash lookup per batch. Declared rather than
      # defaulted: it is a UPF decision. The QFI field doubles the mask shapes a
      # session's rules take (one variant per existing shape), so the number the
      # five-field list was sized for no longer covers a table with it.
      max_tuples: 16
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
        - {attr_name: meter_id, value_offset: 4, num_bytes: 8, reference: mt_ul/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 12, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 16, num_bytes: 4}
  - name: pdr_dl
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
        - {attr_name: route_domain, num_bytes: 4}
        - {attr_name: fteid_context, num_bytes: 4}
        - {attr_name: qfi, num_bytes: 1}
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports -- and each is one hash lookup per
      # batch. Declared rather than defaulted: it is a UPF decision.
      max_tuples: 8
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
        - {attr_name: meter_id, value_offset: 4, num_bytes: 8, reference: mt_dl/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 12, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 16, num_bytes: 4}
        - {attr_name: steering_policy_id, value_offset: 20, num_bytes: 4}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: atsss
    mclass: AtsssSteer
    arg: {policy_attr: steering_policy_id, next_hop_attr: next_hop_id}
  # The hop count is the Router's, as in deploy/upf.yaml. No packets cross
  # this graph; the modules are here so the chain's shape is the deployment's.
  - name: rt
    mclass: Router
  - name: enc
    mclass: GtpuEncap
    arg: {max_tunnels: 65536}
  - name: mt_transport
    mclass: MetadataTest
    arg: {read: {transport_route_domain: 4}}
  # The N3 ingress tag deploy/upf.yaml puts before the decap: the endpoint the
  # decap reads and the interface's route domain (0) that pdr_dl keys on for
  # the tunneled downlink (F-TEID rules wildcard it; their result rewrites it).
  # This graph has no port, so nothing feeds it; it is the writer every path
  # into the decap starts from. Listed after the inspected modules so the
  # metadata layout above is unchanged.
  - name: tag_n3
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
        - {name: route_domain, size: 4, value_int: 0}
  - name: sink
    mclass: Sink

connections:
  - {upstream: tag_n3, downstream: decap0}
  - {upstream: decap0, downstream: pdr_ul}
  - {upstream: decap0, downstream: pdr_dl, ogate: 1}
  - {upstream: decap0, downstream: mt_md, ogate: 2}
  - {upstream: mt_md, downstream: sink}
  - {upstream: pdr_ul, downstream: mt_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: rt}
  - {upstream: pdr_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: atsss}
  - {upstream: atsss, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: mt_transport}
  - {upstream: mt_transport, downstream: sink}

resources:
  # The next hops written in PDR results are deployment-owned; sessions name
  # them by ID. Both directions use these graph-owned IDs, and the Router maps
  # them to configured gates.
  # Hop 1's MAC pair comes from deploy/upf.yaml: the N6 gateway and interface
  # addresses the Router writes into each frame after it resolves the hop
  # (BESS D-153).
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0, dst_mac: "AgAAAAYC", src_mac: "AgAAAAYB"}
    - key: {id: 2}
      value: {egress_gate: 1}
