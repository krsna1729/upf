# SPDX-License-Identifier: BSD-3-Clause
# Two QERs on one PDR, enforced through one classifier result and one Meter
# with two levels: the meter stack the compiler writes for every PDR.
#
# The point of this graph: a PDR may name several QERs (TS 29.244 7.5.2.2-1),
# each with its own rates. The classifier's result carries both meter ids in
# policing order -- the flow's first, the session's second -- and one Meter
# built with `levels: 2` checks them in that order. A packet the first level
# drops is not charged to the second.
#
# What the graph proves, measured by ci/meter-compose.sh:
#   - `m1` is generous (10 GB/s), so its green gate carries the traffic:
#     gate 0 > 0.
#   - `m2` is 1 byte/s with a one-byte bucket: its red gate is > 0. Had the
#     second level not been read, m2 would count nothing.
modules:
  - name: src
    mclass: Source
    arg: {pkt_size: 64, burst: 32}
  - name: rw
    mclass: Rewrite
    arg:
      templates:
        # A 64-byte frame whose first octet is 0x02: the classifier's one field.
        - "AgECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+Pw=="
  - name: cls
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 0, num_bytes: 1}
      # The two levels, big-endian: meter 1 then meter 2, from the rule's
      # result. The Meter reads the same attribute with levels: 2.
      result_fields:
        - {attr_name: meter_id, value_offset: 0, num_bytes: 8, reference: mt/meters, reference_key: BE32, reference_count: 2}
  - name: mt
    mclass: Meter
    arg: {capacity: 64, levels: 2}
  - name: sink_pass
    mclass: Sink
  - name: sink_yellow
    mclass: Sink
  - name: sink_red
    mclass: Sink
connections:
  - {upstream: src, downstream: rw}
  - {upstream: rw, downstream: cls}
  - {upstream: cls, downstream: mt}
  - {upstream: mt, downstream: sink_pass}
  - {upstream: mt, downstream: sink_yellow, ogate: 1}
  - {upstream: mt, downstream: sink_red, ogate: 2}
resources:
  cls/rules:
    - key: {values: [{value_bin: "Ag=="}], masks: [{value_bin: "/w=="}]}
      value: {priority: 1, gate: 0, result: "AAAAAQAAAAI="}
  mt/meters:
    - key: {id: 1}
      value:
        tr_tcm: {committed_rate: 10000000000, committed_burst: 1000000000, peak_rate: 10000000000, peak_burst: 1000000000}
    - key: {id: 2}
      value:
        tr_tcm: {committed_rate: 1, committed_burst: 1, peak_rate: 1, peak_burst: 1}
