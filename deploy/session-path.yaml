# SPDX-License-Identifier: BSD-3-Clause

# The UPF's whole packet path, on one host, with no NIC: the same composition
# as deploy/session-live.yaml (the module names internal/session's Config
# names) plus what it takes to put packets through it and see them.
#
# uplink    src_up -> rewrite_up -> endpoint tag -> decap0/fteids -> pdr_ul -> mt_ul -> cnt_ul -> rt -> N6
# downlink  src_dn -> rewrite_dn -> tag_n6 -> Vif -> pdr_dl -> mt_dl -> cnt_dl -> rt -> enc -> mt_transport -> dump/sink
#
# A third, idle path is the control plane's own: the unix_port cp_marker uses
# the `upfd -end-marker` base path plus `.1` for transport route domain 1. It
# delivers an End Marker packet (TS 29.244 5.3.2) to a sink, where
# ci/session-path.sh reads it from the daemon's log.
#
# Nothing here is a session: the Go controller writes each session's F-TEID
# admission entry, PDR rule, action, meter, counter and tunnel record in one
# transaction. `ci/session-path.sh` proves the programmed session carries
# packets both ways and that End Markers use the old transport route domain.
#
# The two Sources send continuously from the moment the graph is applied, so a
# sink's counter is zero exactly when no session selects those packets: that is
# the control arm, and it is why the packets are evidence rather than a picture.
# They send in bursts of 32 so the *chains* set the rate rather than the
# generator's one-packet-per-iteration loop (ci/bench-graph.sh measures it).
#
# The frames are the ones the compiler's session makes match:
#   uplink    G-PDU to TEID 0x11223344 (the F-TEID the session's SMF pins),
#             holding the UE's packet 10.45.0.2:5000 -> 8.8.8.8:53
#   downlink  the data network's answer 8.8.8.8:5000 -> 10.45.0.2:53, marked
#             EF (TOS 0xb8, DSCP 46), which the downlink PDR matches ("to
#             assigned 53"), the FAR's outer header creation (TEID 0x55667788
#             toward the gNB) puts GTP-U around, and the encap's DSCP copy
#             carries onto the outer header. It is addressed to the N6
#             interface's MAC, the deployment's own pair.
#
# The N6 side is the deployed graph's (deploy/upf.yaml carries the comments):
# vif_n6 matches the frames addressed to the interface and is where its ARP
# answer is built, l2_sort sends that answer back out of the port rather than
# into the chain, and merge_n6 stands for the port itself -- the router's
# frames and the interface's own leave by it together. dump_n6 is the uplink's
# exit, where ci/session-path.sh reads the frame that left toward N6. The
# Router decrements the TTL in both of its modes, so the chains carry no
# UpdateTTL module.
#
# Metadata attributes are laid out in module registration order, so the module
# that declares "fteid_context" is listed first and the reader that makes it real
# (a write-only attribute no module reads gets no offset) follows it, as in
# deploy/smoke-gtpu.yaml.

ports:
  # The control plane's marker port: a unix socket (SOCK_SEQPACKET) that the
  # controller writes whole End Marker frames to. BESS unlinks the path when it
  # binds, so a run that died leaves nothing behind for the next one.
  - name: cp_marker
    driver: UnixSocketPort
    arg: {path: /tmp/upf-end-marker.sock.1}

modules:
  # The peer's GTP-U Error Indication (TS 29.281 7.3.1): type 26, header TEID 0,
  # and a TEID IE naming the tunnel the peer cannot reach. The endpoint-tagged
  # frame misses `decap0/fteids`, reaches gate 2, and `echo_err` records it for
  # the SMF's Error Indication Report (TS 29.244 5.10). The old I-UPF's End
  # Marker (7.3.2): type 254 on this UPF's own uplink F-TEID (0x11223344 at
  # 192.0.2.1, endpoint 1); `echo_err` records it with its endpoint for the End
  # Marker Reception Report (TS 29.244 8.2.19 REEMR, 8.2.41 EMRRE).
  - name: echo_err
    mclass: GtpuResponder
    arg: {track_errors: true, track_end_markers: true}
  - name: src_err
    mclass: Source
    arg: {pkt_size: 55, burst: 1}
  - name: rewrite_err
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAAApAAAAAEARKpoKFB4CChQeAQhoCGgAFQAAMBoABQAAAAAQVWZ3iA=="
  - name: src_em
    mclass: Source
    arg: {pkt_size: 50, burst: 1}
  - name: rewrite_em
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAAAkAAFAAEARULEKFB4CwAACAQhoCGgAEAAAMP4AABEiM0Q="

  - name: decap0
    mclass: GtpuDecap
  - name: mt_md
    mclass: MetadataTest
    arg:
      read: {endpoint_id: 4, fteid_context: 4, qfi: 1}
  - name: dump_u
    mclass: Dump
    arg: {interval: 1}
  - name: src_up
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABJAAFAAEARUIwKFB4CwAACAQhoCGgANQAAMP8AJREiM0RFAAAlAAFAAEARIIkKLQACCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: set_n3_endpoint
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
        - {name: route_domain, size: 4, value_int: 0}
        - {name: transport_route_domain, size: 4, value_int: 1}
  - name: pdr_ul
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}  # source address (the UE's)
        - {offset: 30, num_bytes: 4}  # destination address
        - {offset: 23, num_bytes: 1}  # protocol
        - {offset: 34, num_bytes: 2}  # source port
        - {offset: 36, num_bytes: 2}  # destination port
        # The decap's exact admission entry supplies a context id that stands
        # for the complete endpoint/family/address/TEID, so another tunnel
        # cannot use this rule.
        - {attr_name: fteid_context, num_bytes: 4}
        - {attr_name: qfi, num_bytes: 1}
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports, and the QFI either named or left open
      # -- and each is one hash lookup per batch. Declared rather than
      # defaulted: it is a UPF decision. The QFI field doubles the mask shapes a
      # session's rules take (one variant per existing shape), so the number the
      # five-field list was sized for no longer covers a table with it.
      max_tuples: 16
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
        - {attr_name: meter_id, value_offset: 4, num_bytes: 8, reference: mt_ul/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 12, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 16, num_bytes: 4}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  # The hop count is the Router's, as in the deployment.
  - name: rt
    mclass: Router
  # The port: the router's frames and the interface's own (l2_sort's ARP gate)
  # leave by it together, and dump_n6 is where the lane reads them.
  - name: merge_n6
    mclass: Merge
  - name: dump_n6
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n6
    mclass: Sink

  - name: src_dn
    mclass: Source
    arg: {pkt_size: 51, burst: 32}
  - name: rewrite_dn
    mclass: Rewrite
    arg:
      templates:
        # The data network's answer, addressed to the N6 interface (the
        # deployment's pair: 02:00:00:00:06:01 from 02:00:00:00:06:02), as a
        # frame arriving on a real N6 port is.
        - "AgAAAAYBAgAAAAYCCABFuAAlAAFAAEARH9EICAgICi0AAhOIADUAEQAAaGVsbG8tdXBm"
  # The N6 port's interface, as the deployment wires it (deploy/upf.yaml has
  # the comments): the Vif matches by (VLAN, MAC) and answers ARP, l2_sort
  # sends the interface's own frames back out of the port rather than into
  # the chain, and a frame naming no interface is dropped in sink_other.
  - name: vif_n6
    mclass: Vif
    arg:
      default_gate: 0
      interfaces:
        - {id: 1, vlan: 0, mac_addr: "02:00:00:00:06:01", ip_addr: "192.0.2.2", route_domain: 0, gate: 1}
  - name: l2_sort
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 12, num_bytes: 2}  # the frame's EtherType (Eth)
      default_gate: 1
  - name: sink_other
    mclass: Sink
  - name: pdr_dl
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
        - {attr_name: route_domain, num_bytes: 4}
        - {attr_name: fteid_context, num_bytes: 4}
        - {attr_name: qfi, num_bytes: 1}
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports -- and each is one hash lookup per
      # batch. Declared rather than defaulted: it is a UPF decision.
      max_tuples: 8
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
        - {attr_name: meter_id, value_offset: 4, num_bytes: 8, reference: mt_dl/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 12, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 16, num_bytes: 4}
        - {attr_name: steering_policy_id, value_offset: 20, num_bytes: 4}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: atsss
    mclass: AtsssSteer
    arg: {policy_attr: steering_policy_id, next_hop_attr: next_hop_id}
  - name: enc
    mclass: GtpuEncap
    arg: {max_tunnels: 65536}
  # Match production: the newly encapsulated frame crosses the outer Router.
  - name: rt_transport
    mclass: Router
    arg: {mode: ROUTE_MODE_DESTINATION, max_domains: 3, max_ipv4_routes: 64, domain_attr: transport_route_domain}
  - name: mt_transport
    mclass: MetadataTest
    arg: {read: {transport_route_domain: 4}}
  - name: dump_d
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n3
    mclass: Sink

  # The control plane's End Marker path: the port a controller writes a marker
  # to, a dump the arm reads it from, and a sink. The port is SOCK_SEQPACKET
  # (unix_socket.cc), so one write is one packet.
  - name: cp_in
    mclass: PortInc
    arg: {port: cp_marker}
  - name: dump_m
    mclass: Dump
    arg: {interval: 1}
  - name: sink_m
    mclass: Sink

  # The N6 ingress tag. pdr_dl keys on the tunnel context and QFI, which only
  # the decap writes; a plain N6 frame carries no tunnel, and context 0 with
  # QFI 0xff (no PDU Session Container) say so: it matches the N6 rules, which
  # wildcard both, and never an F-TEID rule, which names a nonzero context.
  # Listed last so the metadata layout of the modules above is unchanged.
  - name: tag_n6
    mclass: SetMetadata
    arg:
      attrs:
        - {name: fteid_context, size: 4, value_int: 0}
        - {name: qfi, size: 1, value_int: 255}

connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: set_n3_endpoint}
  - {upstream: src_err, downstream: rewrite_err}
  - {upstream: rewrite_err, downstream: set_n3_endpoint}
  - {upstream: src_em, downstream: rewrite_em}
  - {upstream: rewrite_em, downstream: set_n3_endpoint}
  - {upstream: set_n3_endpoint, downstream: decap0}
  - {upstream: decap0, downstream: mt_md}
  - {upstream: decap0, downstream: pdr_dl, ogate: 1}
  - {upstream: decap0, downstream: echo_err, ogate: 2}
  - {upstream: mt_md, downstream: dump_u}
  - {upstream: dump_u, downstream: pdr_ul}
  - {upstream: pdr_ul, downstream: mt_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: rt}
  - {upstream: rt, downstream: merge_n6}
  - {upstream: merge_n6, downstream: dump_n6}
  - {upstream: dump_n6, downstream: sink_n6}

  - {upstream: src_dn, downstream: rewrite_dn}
  # The interface's gate: its IP frames enter the downlink table, and its own
  # answer (l2_sort's rule) joins the port.
  - {upstream: rewrite_dn, downstream: tag_n6}
  - {upstream: tag_n6, downstream: vif_n6}
  - {upstream: vif_n6, downstream: l2_sort, ogate: 1}
  - {upstream: l2_sort, downstream: pdr_dl, ogate: 1}
  - {upstream: l2_sort, downstream: merge_n6}
  - {upstream: vif_n6, downstream: sink_other}
  - {upstream: pdr_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: atsss}
  - {upstream: atsss, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: rt_transport}
  - {upstream: rt_transport, downstream: mt_transport}
  - {upstream: mt_transport, downstream: dump_d}
  - {upstream: dump_d, downstream: sink_n3}

  # The control plane's markers: the port's packets go straight to the dump,
  # never through a rule -- an End Marker is not session traffic.
  - {upstream: cp_in, downstream: dump_m}
  - {upstream: dump_m, downstream: sink_m}

workers:
  - {wid: 0, core: 0}

resources:
  # The actions' next hops: the deployment's, not a session's (a session's
  # action names them by id). Every chain's result writes the next hop
  # it writes -- the module fails closed when the attribute has no reader -- so
  # both directions have one: the uplink's leaves by gate 0 toward N6, the
  # downlink's by gate 1 toward the encap. A `Router`'s `routes` table is not on
  # this path: an action that names a next hop has already resolved it, and the
  # table is for a deployment that wants prefix routing instead (module
  # `IPLookup`, whose routes are gate-valued and are looked up per packet).
  # Hop 1's MACs are the deployment's N6 pair (base64: 02:00:00:00:06:02 and
  # 02:00:00:00:06:01), written into every frame the Router resolves that hop
  # for (BESS D-153); the lane's N6 check reads them.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0, dst_mac: "AgAAAAYC", src_mac: "AgAAAAYB"}
    - key: {id: 2}
      value: {egress_gate: 1}
  rt_transport/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0}
  rt_transport/routes:
    - key: {ipv4: "0.0.0.0", prefix_length: 0, domain: 1}
      value: {next_hop_id: 1}

  # l2_sort's one rule: an ARP frame (0x0806) -- the Vif's own answer -- leaves
  # by the port instead of entering the chain. Everything else takes the
  # default gate, into the downlink table.
  l2_sort/rules:
    - key: {fields: [{value_bin: "CAY="}]}
      value: {gate: 0}
