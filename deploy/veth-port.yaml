# SPDX-License-Identifier: BSD-3-Clause

# The N3/N6/N9 port work without a NIC: one PMD port, four receive queues, and
# a `Vif` splitting it into the three reference points, each with its own
# address and its own route domain. `ci/veth-port.sh` deploys this graph on a
# kernel veth (the af_packet PMD) and checks it; docs/design.md's port section
# and docs/datapath.md hold what that proves and what still waits for hardware.
#
# The port is declared here, in the manifest, because `bessd` has no DPDK-args
# passthrough: it builds its own EAL argv (core/runtime/dpdk.cc) and hot-plugs
# what a manifest declares with rte_dev_probe (core/drivers/pmd.cc). The vdev
# string is the af_packet PMD's own, and `qpairs=4` sets the PMD's queue count
# (drivers/net/af_packet's ETH_AF_PACKET_NUM_Q_ARG) -- which is why the four
# QueueIncs below have four queues to read, whatever the veth's numrxqueues.
#
# The reference points are data, not code: an interface is an address, a MAC, a
# route domain and an output gate, and the deployment's three of them live in
# this file. The rule keys the compiler writes into the PDR tables below are
# the other half (docs/design.md, "N3, N6, N9: all PMD partitions").
ports:
  - name: upf_port
    driver: PMDPort
    num_rx_queues: 4
    num_tx_queues: 4
    # ci/veth-port.sh substitutes its run-isolated veth name here.
    arg: {vdev: "net_af_packet0,iface=__VETH_IFACE__,qpairs=4,fanout_mode=hash"}

modules:
  # One QueueInc per qid: the port's four queues, each its own task, all reading
  # into the one Vif. That is what makes a per-queue spread observable under a
  # flow fanout (af_packet's fanout_mode=hash places a flow on one queue), and
  # it is the shape a deployment with more than one worker needs (D-097).
  - name: inc0
    mclass: QueueInc
    arg: {port: upf_port, qid: 0}
  - name: inc1
    mclass: QueueInc
    arg: {port: upf_port, qid: 1}
  - name: inc2
    mclass: QueueInc
    arg: {port: upf_port, qid: 2}
  - name: inc3
    mclass: QueueInc
    arg: {port: upf_port, qid: 3}

  # The port split into the three reference points (docs/design.md, "N3, N6,
  # N9: all PMD partitions"): one interface per reference point, each
  # with its own MAC, its own address (so the Vif answers ARP on its behalf),
  # its own route domain, and its own output gate. Untagged (vlan: 0): nothing
  # here needs them tagged apart. Gate 0 is the default: a frame whose
  # destination MAC names no interface.
  - name: vif
    mclass: Vif
    arg:
      default_gate: 0
      vif_id_attr: neighbor_interface_id
      interfaces:
        # N3, the access side: GTP-U toward the RAN.
        - {id: 1, vlan: 0, mac_addr: "02:00:00:00:01:01", ip_addr: "192.0.2.101", route_domain: 1, gate: 1}
        # N9, a peer UPF: GTP-U, the same shape as N3.
        - {id: 2, vlan: 0, mac_addr: "02:00:00:00:02:02", ip_addr: "192.0.2.102", route_domain: 2, gate: 2}
        # N6, the data network: plain IP.
        - {id: 3, vlan: 0, mac_addr: "02:00:00:00:03:03", ip_addr: "192.0.2.103", route_domain: 3, gate: 3}
  - name: sink_other
    mclass: Sink
  - name: n3_eth_sort
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 12, num_bytes: 2}
      default_gate: 1
  - name: n9_eth_sort
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 12, num_bytes: 2}
      default_gate: 1
  - name: n3_arp_opcode
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 20, num_bytes: 2}
      default_gate: 0
  - name: n3_arp_sender_sort
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 28, num_bytes: 4}
      default_gate: 1

  # The reader that makes Vif and decap metadata offsets available.
  - name: mt_vif
    mclass: MetadataTest
    arg: {read: {neighbor_interface_id: 4, route_domain: 4}}

  # -- the N6 ingress: plain IP ------------------------------------------------
  # pdr_dl keys on the tunnel context and QFI, which only the decap writes. A
  # plain N6 packet carries no tunnel: context 0 and QFI 0xff (no PDU Session
  # Container) name exactly that, so it matches the N6 rules, which wildcard
  # both, and never an F-TEID rule, which names a nonzero context.
  - name: tag_n6
    mclass: SetMetadata
    arg:
      attrs:
        - {name: fteid_context, size: 4, value_int: 0}
        - {name: qfi, size: 1, value_int: 255}

  # -- the N3/N9 ingress: GTP-U -----------------------------------------------
  # Tagged before the EtherType split, so the ARP branch toward rt_transport
  # carries the transport route domain too.
  - name: tag_n3
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
        - {name: transport_route_domain, size: 4, value_int: 1}
  - name: tag_n9
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 2}
        - {name: transport_route_domain, size: 4, value_int: 2}
  - name: decap0
    mclass: GtpuDecap
  - name: mt_md
    mclass: MetadataTest
    arg:
      read: {endpoint_id: 4, fteid_context: 4, qfi: 1}
  # -- the PDR tables the compiler writes into --------------------------------
  - name: pdr_ul
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}  # source address
        - {offset: 30, num_bytes: 4}  # destination address
        - {offset: 23, num_bytes: 1}  # protocol
        - {offset: 34, num_bytes: 2}  # source port
        - {offset: 36, num_bytes: 2}  # destination port
        - {attr_name: fteid_context, num_bytes: 4}
        - {attr_name: qfi, num_bytes: 1}
      # Distinct masks in use at once: a session's shapes are its filters', and
      # each is one hash lookup per batch. Declared rather than defaulted: it is
      # a UPF decision (D-141).
      max_tuples: 16
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
        - {attr_name: meter_id, value_offset: 4, num_bytes: 8, reference: mt_ul/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 12, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 16, num_bytes: 4}
  # The downlink table retains the Vif's route domain in addition to endpoint metadata.
  - name: pdr_dl
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
        - {attr_name: route_domain, num_bytes: 4}
        - {attr_name: fteid_context, num_bytes: 4}
        - {attr_name: qfi, num_bytes: 1}
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
        - {attr_name: meter_id, value_offset: 4, num_bytes: 8, reference: mt_dl/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 12, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 16, num_bytes: 4}
        - {attr_name: steering_policy_id, value_offset: 20, num_bytes: 4}

  # -- the two chains the compiler writes into --------------------------------
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  # The PDR result writes the inner Network Instance's route_domain after the
  # match. The N6 Vif writes the attachment's domain before downlink matching.
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: atsss
    mclass: AtsssSteer
    arg: {policy_attr: steering_policy_id, next_hop_attr: next_hop_id}

  # A route domain per reference point, and the router bound to hold them. The
  # bound is 4 and the domains are 1..3 because the Router creates every
  # domain's FIB eagerly (router.cc's CreateDomain loop): a `max_domains` in the
  # tens fails to build on this box, which is a fact about that module, not
  # about the port. upfd's own `-max-domains` must agree with this number.
  - name: rt
    mclass: Router
    arg: {max_domains: 4}
  - name: enc
    mclass: GtpuEncap
    arg: {max_tunnels: 65536}
  # Outer tunnels resolve their peer after encap, in the tunnel's route domain.
  # It routes by destination, so it reads no next hop: its next-hop attribute
  # is renamed apart from the inner chain's, which would otherwise make the
  # ARP branch (no next-hop writer) unreadable for rt and every reader before it.
  - name: rt_transport
    mclass: Router
    arg:
      mode: ROUTE_MODE_DESTINATION
      max_domains: 4
      domain_attr: transport_route_domain
      neighbor_interface_attr: neighbor_interface_id
      next_hop_attr: transport_next_hop_id
      resolver_interfaces:
        - {id: 1, egress_gate: 0, mac: "AgAAAAEB", ipv4: "192.0.2.101"}
        - {id: 2, egress_gate: 1, mac: "AgAAAAIC", ipv4: "192.0.2.102"}
      neighbor_bindings:
        - {next_hop_id: 1, interface_id: 1, ipv4: "192.0.2.2"}
        - {next_hop_id: 2, interface_id: 2, ipv4: "192.0.2.2"}
  - name: merge_n3
    mclass: Merge
  - name: dump_n3
    mclass: Dump
    arg: {interval: 1}
  # The port's transmit side: one queue per direction, as the receive side has
  # one per qid.
  - name: n6_out
    mclass: QueueOut
    arg: {port: upf_port, qid: 0}
  - name: n3_out
    mclass: QueueOut
    arg: {port: upf_port, qid: 1}

connections:
  - {upstream: inc0, downstream: vif}
  - {upstream: inc1, downstream: vif}
  - {upstream: inc2, downstream: vif}
  - {upstream: inc3, downstream: vif}
  # The Vif's default gate: a frame no interface's MAC names.
  - {upstream: vif, downstream: sink_other}
  # Peer ARP replies go to the transport resolver; local Vif replies go out the
  # port. N3/N9 frames are endpoint-tagged first; IPv4 then reaches F-TEID
  # admission.
  - {upstream: vif, downstream: tag_n3, ogate: 1}
  - {upstream: vif, downstream: tag_n9, ogate: 2}
  - {upstream: tag_n3, downstream: n3_eth_sort}
  - {upstream: tag_n9, downstream: n9_eth_sort}
  - {upstream: n3_eth_sort, downstream: n3_arp_opcode, ogate: 0}
  - {upstream: n3_eth_sort, downstream: decap0, ogate: 1}
  - {upstream: n9_eth_sort, downstream: n3_arp_opcode, ogate: 0}
  - {upstream: n9_eth_sort, downstream: decap0, ogate: 1}
  - {upstream: n3_arp_opcode, downstream: sink_other, ogate: 0}
  - {upstream: n3_arp_opcode, downstream: n3_arp_sender_sort, ogate: 1}
  - {upstream: n3_arp_sender_sort, downstream: merge_n3, ogate: 0}
  - {upstream: n3_arp_sender_sort, downstream: rt_transport, ogate: 1}
  - {upstream: vif, downstream: tag_n6, ogate: 3}
  - {upstream: tag_n6, downstream: mt_vif}
  - {upstream: mt_vif, downstream: pdr_dl}

  # Tunneled downlink (decap gate 1) carries the Vif's N3/N9 route_domain:
  # F-TEID rules wildcard it and their result rewrites it.
  - {upstream: decap0, downstream: mt_md, ogate: 0}
  - {upstream: decap0, downstream: pdr_dl, ogate: 1}
  - {upstream: mt_md, downstream: pdr_ul}
  - {upstream: pdr_ul, downstream: mt_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: rt}

  - {upstream: pdr_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: atsss}
  - {upstream: atsss, downstream: rt}

  - {upstream: rt, downstream: n6_out}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: rt_transport}
  - {upstream: rt_transport, downstream: merge_n3, ogate: 0}
  - {upstream: rt_transport, downstream: merge_n3, ogate: 1}
  - {upstream: merge_n3, downstream: dump_n3}
  - {upstream: dump_n3, downstream: n3_out}

workers:
  - {wid: 0, core: 0}

resources:
  # The actions' next hops: the deployment's, not a session's (a session's
  # action names them by id). Every chain's result writes the next hop
  # it writes -- the module fails closed when the attribute has no reader -- so
  # both directions have one: the uplink's leaves by gate 0 toward N6, the
  # downlink's by gate 1 toward the encap.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0}
    - key: {id: 2}
      value: {egress_gate: 1}
  # Each transport route names its resolver-owned next hop.
  rt_transport/routes:
    - key: {ipv4: "0.0.0.0", prefix_length: 0, domain: 1}
      value: {next_hop_id: 1}
    - key: {ipv4: "0.0.0.0", prefix_length: 0, domain: 2}
      value: {next_hop_id: 2}
  n3_eth_sort/rules:
    - key: {fields: [{value_bin: "CAY="}]}
      value: {gate: 0}
  n9_eth_sort/rules:
    - key: {fields: [{value_bin: "CAY="}]}
      value: {gate: 0}
  n3_arp_opcode/rules:
    - key: {fields: [{value_bin: "AAE="}]}
      value: {gate: 0}
    - key: {fields: [{value_bin: "AAI="}]}
      value: {gate: 1}
  n3_arp_sender_sort/rules:
    - key: {fields: [{value_bin: "wAACZQ=="}]}
      value: {gate: 0}
    - key: {fields: [{value_bin: "wAACZg=="}]}
      value: {gate: 0}
