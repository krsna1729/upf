# SPDX-License-Identifier: BSD-3-Clause

# The UPF's whole packet path, on one host, with no NIC: the same composition
# as deploy/session-live.yaml (the module names internal/session's Config
# names) plus what it takes to put packets through it and see them.
#
# uplink    src_up -> rewrite_up -> teid -> decap0 -> pdr_ul -> at_ul -> mt_ul -> cnt_ul -> rt -> sink_n6
#   downlink  src_dn -> rewrite_dn -> pdr_dl -> at_dl -> mt_dl -> cnt_dl -> enc -> sink_n3
#
# A third, idle path is the control plane's own: the unix_port cp_marker (the
# port `upfd -end-marker` writes to) delivers an End Marker packet
# (TS 29.244 5.3.2) to a sink, where ci/session-path.sh reads it out of the
# daemon's log. Nothing of a session's traffic passes through it.
#
# Nothing here is a session: the Go controller writes every rule, action,
# meter, counter, tunnel and TEID rule, and `ci/session-path.sh` proves a session
# programmed over the control plane carries packets both ways -- the uplink's
# count needs the TEID rule, the decap and the PDR rule; the downlink's needs
# the PDR rule, its action, its meter and the tunnel record the encap reads.
#
# The two Sources send continuously from the moment the graph is applied, so a
# sink's counter is zero exactly when no session selects those packets: that is
# the control arm, and it is why the packets are evidence rather than a picture.
# They send in bursts of 32 so the *chains* set the rate rather than the
# generator's one-packet-per-iteration loop (ci/bench-graph.sh measures it).
#
# The frames are the ones the compiler's session makes match:
#   uplink    G-PDU to TEID 0x11223344 (the F-TEID the session's SMF pins),
#             holding the UE's packet 10.45.0.2:5000 -> 8.8.8.8:53
#   downlink  the data network's answer 8.8.8.8:5000 -> 10.45.0.2:53, marked
#             EF (TOS 0xb8, DSCP 46), which the downlink PDR matches ("to
#             assigned 53"), the FAR's outer header creation (TEID 0x55667788
#             toward the gNB) puts GTP-U around, and the encap's DSCP copy
#             carries onto the outer header.
#
# Metadata attributes are laid out in module registration order, so the module
# that declares "upf_teid" is listed first and the reader that makes it real
# (a write-only attribute no module reads gets no offset) follows it, as in
# SPDX-License-Identifier: BSD-3-Clause

# deploy/session-path.yaml plus the buffering branch, which is the one shape
# that graph cannot be: the buffering arm needs the store, and the other arms'
# graphs must keep validating against a daemon that does not carry BESS's
# key_attrs change yet (packet_store.c, commit 128fd237). When that stage is the
# deployed one this branch belongs in deploy/upf.yaml and the two merge.
#
# The branch: a FAR whose Apply Action is BUFF and not FORW (TS 29.244 8.2.26)
# delivers its rule's packets on gate 1 of pdr_dl, where the counter in front of
# the store is what makes a flow's first buffered packet visible to upfd (5.2.4.1:
# the Downlink Data Report). The store keys its flows by the ActionId the
# classifier wrote, with the deployment's caps and timeout; the SMF's own numbers
# (8.2.29, 8.2.30) are the module's flows resource, written by the session
# compiler. Gate 0 releases into the action path -- what was held was never
# processed, so the instruction in force when it leaves is the one that applies
# -- and gate 1 is eviction and overflow, unwired: the daemon's gate counters are
# where those drops are visible.

# deploy/smoke-gtpu.yaml.

ports:
  # The control plane's marker port: a unix socket (SOCK_SEQPACKET) that the
  # controller writes whole End Marker frames to. BESS unlinks the path when it
  # binds, so a run that died leaves nothing behind for the next one.
  - name: cp_marker
    driver: UnixSocketPort
    arg: {path: /tmp/upf-end-marker.sock}

modules:
  - name: decap0
    mclass: GtpuDecap
  - name: mt_md
    mclass: MetadataTest
    arg:
      read: {upf_teid: 4}
  - name: dump_u
    mclass: Dump
    arg: {interval: 1}
  - name: src_up
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAACAgAAAAABCABFAABJAAFAAEARUIwKFB4CwAACAQhoCGgANQAAMP8AJREiM0RFAAAlAAFAAEARIIkKLQACCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: teid
    mclass: WildcardMatch
    arg:
      fields:
        # The G-PDU's TEID: Eth (14) + IPv4 (20) + UDP (8) + the GTP-U header's
        # flags, type and length (4). One rule per session; a TEID no rule
        # names is dropped by the default gate.
        - {offset: 46, num_bytes: 4}
  - name: pdr_ul
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}  # source address (the UE's)
        - {offset: 30, num_bytes: 4}  # destination address
        - {offset: 23, num_bytes: 1}  # protocol
        - {offset: 34, num_bytes: 2}  # source port
        - {offset: 36, num_bytes: 2}  # destination port
        # The QoS flow the packet belongs to, as the decap read it out of the
        # G-PDU's PDU Session Container (TS 29.244 8.2.89): what tells a
        # session's several uplink PDRs for one F-TEID apart. It is last, so the
        # fields before it keep the positions they had.
        - {attr_name: qfi, num_bytes: 1}
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports, and the QFI either named or left open
      # -- and each is one hash lookup per batch. Declared rather than
      # defaulted: it is a UPF decision. The QFI field doubles the mask shapes a
      # session's rules take (one variant per existing shape), so the number the
      # five-field list was sized for no longer covers a table with it.
      max_tuples: 16
      action_resource: at_ul/actions
  - name: at_ul
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_ul/meters, next_hops: rt/next_hops}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: rt
    mclass: Router
  - name: sink_n6
    mclass: Sink

  - name: src_dn
    mclass: Source
    arg: {pkt_size: 51, burst: 32}
  - name: rewrite_dn
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAACCABFuAAlAAFAAEARH9EICAgICi0AAhOIADUAEQAAaGVsbG8tdXBm"
  - name: pdr_dl
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
      # Distinct masks in use at once: a session's shapes are its filters' --
      # exact addresses, prefixes, ports -- and each is one hash lookup per
      # batch. Declared rather than defaulted: it is a UPF decision.
      max_tuples: 8
      action_resource: at_dl/actions
  - name: at_dl
    mclass: ActionTable
    arg: {capacity: 65536, meters: mt_dl/meters, next_hops: rt/next_hops}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536}
  - name: cnt_buf
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: buf
    mclass: PacketStore
    arg: {key_attrs: ["action_id"], max_packets: 65536, max_packets_per_flow: 64, timeout_ms: 5000}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: enc
    mclass: GtpuEncap
    arg: {src_ip: "192.0.2.1", max_tunnels: 65536}
  - name: dump_d
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n3
    mclass: Sink

  # The control plane's End Marker path: the port a controller writes a marker
  # to, a dump the arm reads it from, and a sink. The port is SOCK_SEQPACKET
  # (unix_socket.cc), so one write is one packet.
  - name: cp_in
    mclass: PortInc
    arg: {port: cp_marker}
  - name: dump_m
    mclass: Dump
    arg: {interval: 1}
  - name: sink_m
    mclass: Sink

connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: teid}
  - {upstream: teid, downstream: decap0}
  - {upstream: decap0, downstream: mt_md}
  - {upstream: mt_md, downstream: dump_u}
  - {upstream: dump_u, downstream: pdr_ul}
  - {upstream: pdr_ul, downstream: at_ul}
  - {upstream: at_ul, downstream: mt_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: rt}
  - {upstream: rt, downstream: sink_n6}

  - {upstream: src_dn, downstream: rewrite_dn}
  - {upstream: rewrite_dn, downstream: pdr_dl}
  - {upstream: pdr_dl, downstream: at_dl}
  - {upstream: pdr_dl, downstream: cnt_buf, ogate: 1}
  - {upstream: cnt_buf, downstream: buf}
  - {upstream: buf, downstream: at_dl, ogate: 0}
  - {upstream: at_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: rt}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: enc, downstream: dump_d}
  - {upstream: dump_d, downstream: sink_n3}

  # The control plane's markers: the port's packets go straight to the dump,
  # never through a rule -- an End Marker is not session traffic.
  - {upstream: cp_in, downstream: dump_m}
  - {upstream: dump_m, downstream: sink_m}

workers:
  - {wid: 0, core: 0}

resources:
  # The actions' next hops: the deployment's, not a session's (a session's
  # action names them by id). Every chain with an ActionTable routes on the id
  # it writes -- the module fails closed when the attribute has no reader -- so
  # both directions have one: the uplink's leaves by gate 0 toward N6, the
  # downlink's by gate 1 toward the encap. A `Router`'s `routes` table is not on
  # this path: an action that names a next hop has already resolved it, and the
  # table is for a deployment that wants prefix routing instead (module
  # `IPLookup`, whose routes are gate-valued and are looked up per packet).
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0}
    - key: {id: 2}
      value: {egress_gate: 1}
