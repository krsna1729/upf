# SPDX-License-Identifier: BSD-3-Clause

# The interface grammar's lane: deploy/upf.yaml's packet path, on one host with
# no NIC, wired so every PFCP Source Interface and Destination Interface value
# this UPF serves has an egress to leave by -- and driven by ci/ifacepath, whose
# compiler is the deployment's own (-instances' egress table), one session per
# case.
#
#   uplink    src_up  -> rewrite_up  -> tag_n3 -> decap0 -> mt_md -> pdr_ul -> mt_ul -> cnt_ul -> rt
#             src_up2 -> rewrite_up2 -/                                                            rt -> dump_n6      (ogate 0, N6)
#             src_up3 -> rewrite_up3 -/
#             src_ulcl_n6, src_ulcl_n9 -> rewrite_ulcl_* -/                                       (one session, two PDRs)
#                                                                                                 rt -> enc -> dump_n3 (ogates 1, 2)
#             src_vn  -> rewrite_vn  -/                                                            rt -> dump_lan     (ogate 3, the service LAN)
#             src_n19out, src_m6ul10, src_m6ul13, src_m6fwd10, src_m6fwd13 -/                     rt -> tag_vn -> pdr_dl (ogate 4, the 5G VN re-injection)
#   N9        src_n9  -> rewrite_n9  -> tag_n9 -> decap0 (Mode 3's uplink: ogate 0, pdr_ul)
#             src_ulcl_dn9 -> rewrite_ulcl_dn9 -/      (Mode 2's remote-PSA downlink: ogate 1, pdr_dl)
#             src_m4ul, src_m4dl, src_n19in, src_m6dl10, src_m6t -/
#   downlink  src_dn -> rewrite_dn -> l2_sort -> tag_n6 -> vif_n6 -> pdr_dl -> mt_dl -> cnt_dl -> atsss -> rt
#             src_dn1 -> rewrite_dn1 -/ (Mode 1's downlink)
#             src_arp -> rewrite_arp -> l2_sort -> arp_n6 -> dump_arp -> merge_n6 -> dump_n6 -> sink_n6
#             (src_arp2 -> rewrite_arp2, the pair of addresses one session holds)
#   End Marker em_n3 -> tag_n3, em_n9 -> tag_n9 -> decap0 (ogate 2) -> echo_em -> sink_em
#             decap0 (ogate 3, the relayed markers) -> em_relay -> mt_em -> dump_em -> sink_em
#
# The exits are the deployment's egress table, one hop id each (rt/next_hops
# below), and the driver's session.Config names the same numbers: hop 1 is the
# data network's plain exit (N6, the instance's own `next-hop`), hop 2 the
# access side's (the encap: "DestInterface Access" leaves by -access-next-hop,
# which is what a downlink FAR and an uplink indirect-forwarding FAR alike take),
# hop 3 a tunnel out of an instance (tunnel-next-hop: N9, or the
# indirect-forwarding tunnel), hop 4 the service LAN's (sgi-lan-next-hop, with
# its own L2 pair here) and hop 5 the re-injection's (vn-next-hop, into the
# subscriber-side table). A deployment that names none of those keys serves the
# data network and the access side, and the values it does not declare are
# refused rather than silently sent out of N6 -- ci/ifacepath drives those too.
#
# The Router's gate is interface - 1 (D-049), so hop 3's egress_gate 2 and hop
# 5's 4 are this file's connections to enc and to tag_vn -> pdr_dl.
#
# The ARP proxy is on the ingress' ARP branch: l2_sort sends every ARP frame to
# arp_n6 (an ARP request names the broadcast MAC, so no Vif would match it), and
# the responder answers for the addresses its "entries" resource holds -- the
# deployment's own entry for the interface (below) and one entry per session per
# UE address, which ci/ifacepath writes and deletes with the sessions it
# establishes. deploy/upf.yaml carries the same two modules and the same wiring;
# this file adds what it takes to inject frames and read where they left.
#
# The frames, byte for byte (all with the payload "hello-upf"):
#   rewrite_up   a G-PDU to TEID 0x11223344 holding 10.45.0.2:5000 -> 8.8.8.8:53
#   rewrite_up2  the same to TEID 0x11223345, 10.45.0.3
#   rewrite_up3  the same to TEID 0x11223346, 10.45.0.4
#   rewrite_ulcl_n6  a G-PDU to TEID 0x1122334b holding 10.45.0.8:5000 -> 8.8.8.8:53
#   rewrite_ulcl_n9  the same TEID and source, to 10.46.0.2:53 (the N9 branch)
#   rewrite_vn   a G-PDU to TEID 0x11223347 holding 10.45.0.5:5000 -> 10.45.0.6:5000
#                (the 5G VN case: one UE's packet to another UE of the same VN)
#   rewrite_n9   a G-PDU to 192.0.2.9 (the N9 endpoint) and TEID 0x11223344 -- S1's
#                TEID, on the other endpoint -- holding 10.45.0.9:5000 -> 8.8.8.8:53
#                (Mode 3: S9's uplink, arriving over N9 from an I-UPF)
#   rewrite_ulcl_dn9  a G-PDU to 192.0.2.9 and TEID 0x1122334c holding
#                10.46.0.2:53 -> 10.45.0.8:5000 (Mode 2: the remote PSA's downlink)
#   rewrite_dn   the data network's answer 8.8.8.8:5000 -> 10.45.0.7:53, to the
#                interface's MAC (02:00:00:00:06:01 from 02:00:00:00:06:02)
#   rewrite_dn1  the same answer to S1's UE, 8.8.8.8:5000 -> 10.45.0.2:53 (Mode 1's
#                downlink)
#   rewrite_m4ul a G-PDU to 192.0.2.9 and TEID 0x1122334e holding
#                10.45.0.11:5000 -> 8.8.8.8:53 (Mode 4: the upstream I-UPF's uplink, S11)
#   rewrite_m4dl the same endpoint, TEID 0x1122334f, 8.8.8.8:5000 -> 10.45.0.11:53
#                (Mode 4: the PSA's downlink)
#   rewrite_n19in  a G-PDU to 192.0.2.9 and TEID 0x11223350 (S12's N19 F-TEID)
#                holding 10.45.9.2:5000 -> 10.45.0.6:5000 (the other PSA's member to S5's UE)
#   rewrite_n19out a G-PDU to TEID 0x11223347 (S4's) holding 10.45.0.5:5000 ->
#                10.45.9.2:5000 (S4's UE to the member the other PSA anchors)
#   rewrite_m6ul10 a G-PDU to TEID 0x1122334d holding 10.45.0.10:5000 -> 8.8.8.8:53
#                (Mode 6: S10's uplink, the source I-UPF)
#   rewrite_m6dl10 a G-PDU to 192.0.2.9 and TEID 0x11223351 holding
#                8.8.8.8:5000 -> 10.45.0.10:53 (the PSA's downlink to S10)
#   rewrite_m6ul13 a G-PDU to TEID 0x11223352 holding 10.45.0.13:5000 -> 8.8.8.8:53
#                (S13's uplink, the target I-UPF)
#   rewrite_m6t  a G-PDU to 192.0.2.9 and TEID 0x11223353 holding
#                8.8.8.8:5000 -> 10.45.0.13:53 (the PSA's downlink to S13)
#   rewrite_m6fwd10, rewrite_m6fwd13  the downlink being forwarded, 8.8.8.8:5000 ->
#                10.45.0.10:53 and -> 10.45.0.13:53, to the N3 endpoint; the TEID
#                below is 0 because the UP function chooses each forwarding
#                F-TEID, and ci/ifacepath rewrites both templates (rewrite_*/templates)
#                to the TEID the Created PDR names
#   em_in_n3, em_in_n9  End Markers (type 254, TS 29.281 7.3.2) a peer sends to
#                an F-TEID on the N3 or N9 endpoint: ci/ifacepath writes each
#                one to the port, so the count is exact
#   rewrite_arp  an ARP request for 10.45.0.2 from 192.0.2.2
#   rewrite_arp2 the same for 10.44.0.2 (the sibling of 10.46.0.2: one
#                session's two addresses, one transaction, one probe slot)
#
# Received End Markers: decap0 relays each one on a forwarding or transit
# F-TEID out its gate 3, once per tunnel its admission entry names (the
# compiler writes the relays with the entry), through em_relay -- the
# deployment's queue -- to dump_em; and sends it on to gate 2, where echo_em
# records it (track_end_markers).
#
# Metadata attributes are laid out in module registration order: the reader makes
# decap and endpoint metadata real before the PDR tables consume them.
#
# The socket paths are ci/iface-path.sh's to render: it replaces the
# /tmp/upf-iface-path- prefix with the run's own directory.

ports:
  # No NIC: the streams are Sources and the exits are Dumps. The port exists so
  # the file matches the deployment's shape (deploy/upf.yaml binds a real one).
  - name: cp_marker
    driver: UnixSocketPort
    arg: {path: /tmp/upf-iface-path-end-marker.sock}
  - name: em_in_n3
    driver: UnixSocketPort
    arg: {path: /tmp/upf-iface-path-em-n3.sock}
  - name: em_in_n9
    driver: UnixSocketPort
    arg: {path: /tmp/upf-iface-path-em-n9.sock}

modules:
  - name: decap0
    mclass: GtpuDecap
  - name: mt_md
    mclass: MetadataTest
    arg:
      read: {endpoint_id: 4, fteid_context: 4, qfi: 1}
  - name: tag_n3
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 1}
        - {name: route_domain, size: 4, value_int: 0}
        - {name: transport_route_domain, size: 4, value_int: 1}
  # The N9 endpoint's tag: endpoint 2 is what admits a G-PDU on an N9 F-TEID
  # and refuses it on an N3 one, whatever the TEID.
  - name: tag_n9
    mclass: SetMetadata
    arg:
      attrs:
        - {name: endpoint_id, size: 4, value_int: 2}
        - {name: route_domain, size: 4, value_int: 0}
        - {name: transport_route_domain, size: 4, value_int: 2}
  # -- the uplink streams ------------------------------------------------------
  - name: src_up
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_up
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM0RFAAAlEjQAAEARTlYKLQACCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: src_up2
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_up2
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM0VFAAAlEjQAAEARTlUKLQADCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: src_up3
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_up3
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM0ZFAAAlEjQAAEARTlQKLQAECAgICBOIADUAEQAAaGVsbG8tdXBm"
  # One session, two destinations, one tunnel: the ULCL branch. Both frames
  # carry the same TEID; the PDRs differ only in the destination they select.
  - name: src_ulcl_n6
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_ulcl_n6
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM0tFAAAlEjQAAEARTlAKLQAICAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: src_ulcl_n9
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_ulcl_n9
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM0tFAAAlEjQAAEARVDAKLQAICi4AAhOIADUAEQAAaGVsbG8tdXBm"
  - name: src_vn
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_vn
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM0dFAAAlEjQAAEARVDAKLQAFCi0ABhOIE4gAEQAAaGVsbG8tdXBm"
  # The N9 arrivals: Mode 3's uplink and Mode 2's remote-PSA downlink.
  - name: src_n9
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_n9
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GTAAAICwAACCQhoCGgANQAAMP8AJREiM0RFAAAlEjQAAEARTk8KLQAJCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: src_ulcl_dn9
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_ulcl_dn9
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GTAAAICwAACCQhoCGgANQAAMP8AJREiM0xFAAAlEjQAAEARVDAKLgACCi0ACAA1E4gAEQAAaGVsbG8tdXBm"
  # Mode 4 (S11, an I-UPF between an I-UPF and the PSA), both legs on N9.
  - name: src_m4ul
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_m4ul
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GTAAAICwAACCQhoCGgANQAAMP8AJREiM05FAAAlEjQAAEARTk0KLQALCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: src_m4dl
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_m4dl
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GTAAAICwAACCQhoCGgANQAAMP8AJREiM09FAAAlEjQAAEARTk0ICAgICi0ACxOIADUAEQAAaGVsbG8tdXBm"
  # N19 (S12, the 5G VN group-level session): in from the other PSA, and out
  # to the member it anchors.
  - name: src_n19in
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_n19in
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GTAAAICwAACCQhoCGgANQAAMP8AJREiM1BFAAAlEjQAAEARSzMKLQkCCi0ABhOIE4gAEQAAaGVsbG8tdXBm"
  - name: src_n19out
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_n19out
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM0dFAAAlEjQAAEARSzQKLQAFCi0JAhOIE4gAEQAAaGVsbG8tdXBm"
  # Mode 6 (S10, the source I-UPF; S13, the target I-UPF), and the downlink
  # each forwards on the F-TEID it chose (the templates ci/ifacepath rewrites).
  - name: src_m6ul10
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_m6ul10
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM01FAAAlEjQAAEARTk4KLQAKCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: src_m6dl10
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_m6dl10
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GTAAAICwAACCQhoCGgANQAAMP8AJREiM1FFAAAlEjQAAEARTk4ICAgICi0AChOIADUAEQAAaGVsbG8tdXBm"
  - name: src_m6ul13
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_m6ul13
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJREiM1JFAAAlEjQAAEARTksKLQANCAgICBOIADUAEQAAaGVsbG8tdXBm"
  - name: src_m6t
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_m6t
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GTAAAICwAACCQhoCGgANQAAMP8AJREiM1NFAAAlEjQAAEARTksICAgICi0ADROIADUAEQAAaGVsbG8tdXBm"
  - name: src_m6fwd10
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_m6fwd10
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJQAAAABFAAAlEjQAAEARTk4ICAgICi0AChOIADUAEQAAaGVsbG8tdXBm"
  - name: src_m6fwd13
    mclass: Source
    arg: {pkt_size: 87, burst: 32}
  - name: rewrite_m6fwd13
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAABAgAAAAABCABFAABJEjQAAEAR5GzAAAICwAACAQhoCGgANQAAMP8AJQAAAABFAAAlEjQAAEARTksICAgICi0ADROIADUAEQAAaGVsbG8tdXBm"

  - name: pdr_ul
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}  # source address (the UE's)
        - {offset: 30, num_bytes: 4}  # destination address
        - {offset: 23, num_bytes: 1}  # protocol
        - {offset: 34, num_bytes: 2}  # source port
        - {offset: 36, num_bytes: 2}  # destination port
        - {attr_name: fteid_context, num_bytes: 4}
        - {attr_name: qfi, num_bytes: 1}
      # Distinct masks in use at once: a session's shapes are its filters', and
      # each is one hash lookup per batch (the QFI field doubles them).
      max_tuples: 16
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
        - {attr_name: meter_id, value_offset: 4, num_bytes: 8, reference: mt_ul/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 12, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 16, num_bytes: 4}
  - name: mt_ul
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_ul
    mclass: UrrCount
    arg: {capacity: 65536}
  # -- the router and the exits ------------------------------------------------
  - name: rt
    mclass: Router
  - name: enc
    mclass: GtpuEncap
    arg: {max_tunnels: 65536}
  - name: mt_transport
    mclass: MetadataTest
    arg: {read: {transport_route_domain: 4}}
  - name: dump_n6
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n6
    mclass: Sink
  - name: dump_n3
    mclass: Dump
    arg: {interval: 1}
  - name: sink_n3
    mclass: Sink
  - name: dump_lan
    mclass: Dump
    arg: {interval: 1}
  - name: sink_lan
    mclass: Sink
  # The 5G VN re-injection's tag (deploy/upf.yaml's tag_vn): the second
  # classification is the 5G VN Internal PDRs', which name no F-TEID, and a
  # cleared admission context keeps the N19 PDR -- keyed by its tunnel's
  # context alone -- from taking the packet it re-injected again.
  - name: tag_vn
    mclass: SetMetadata
    arg:
      attrs:
        - {name: fteid_context, size: 4, value_int: 0}

  # -- End Markers -------------------------------------------------------------
  # Received: written by the driver, tagged like the streams, recorded by the
  # responder behind decap0 gate 2 (its replies, Error Indications for the
  # unknown G-PDUs of m6_released, end in sink_em).
  - name: em_n3
    mclass: PortInc
    arg: {port: em_in_n3}
  - name: em_n9
    mclass: PortInc
    arg: {port: em_in_n9}
  - name: echo_em
    mclass: GtpuResponder
    arg: {track_end_markers: true}
  # Relayed: decap0's gate 3, through the deployment's queue. mt_em reads the
  # transport domain decap0 writes on each relay.
  - name: em_relay
    mclass: Queue
  - name: mt_em
    mclass: MetadataTest
    arg: {read: {transport_route_domain: 4}}
  - name: dump_em
    mclass: Dump
    arg: {interval: 1}
  - name: sink_em
    mclass: Sink

  # -- the downlink ingress ----------------------------------------------------
  - name: src_dn
    mclass: Source
    arg: {pkt_size: 51, burst: 32}
  - name: rewrite_dn
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAYBAgAAAAYCCABFuAAlEjQAAEARTZkICAgICi0ABxOIADUAEQAAaGVsbG8tdXBm"
  - name: src_dn1
    mclass: Source
    arg: {pkt_size: 51, burst: 32}
  - name: rewrite_dn1
    mclass: Rewrite
    arg:
      templates:
        - "AgAAAAYBAgAAAAYCCABFuAAlEjQAAEARTZ4ICAgICi0AAhOIADUAEQAAaGVsbG8tdXBm"
  # The plain N6 ingress tag, on l2_sort's IP gate (the ARP streams share
  # l2_sort, and the tag must cover every path into pdr_dl). pdr_dl keys on the
  # tunnel context and QFI, which only the decap writes; a plain N6 frame
  # carries no tunnel, and context 0 with QFI 0xff (no PDU Session Container)
  # say so: it matches the N6 rules, which wildcard both, and never an F-TEID
  # rule, which names a nonzero context. (vif_n6 writes the route domain.)
  - name: tag_n6
    mclass: SetMetadata
    arg:
      attrs:
        - {name: fteid_context, size: 4, value_int: 0}
        - {name: qfi, size: 1, value_int: 255}
  # The ARP request: "who has 10.45.0.2? tell 192.0.2.2", from the interface the
  # data network resolves (02:00:00:00:06:02), addressed to the broadcast MAC.
  - name: src_arp
    mclass: Source
    arg: {pkt_size: 42, burst: 32}
  - name: rewrite_arp
    mclass: Rewrite
    arg:
      templates:
        - "////////AgAAAAYCCAYAAQgABgQAAQIAAAAGAsAAAgIAAAAAAAAKLQAC"
  # The same request for the second address of one session's pair (10.44.0.2;
  # the responder's table has 131072 slots for the graph's 65536 entries, and
  # two addresses a multiple of 131072 apart start their probe in one slot, so
  # these two are one transaction's collision case).
  - name: src_arp2
    mclass: Source
    arg: {pkt_size: 42, burst: 32}
  - name: rewrite_arp2
    mclass: Rewrite
    arg:
      templates:
        - "////////AgAAAAYCCAYAAQgABgQAAQIAAAAGAsAAAgIAAAAAAAAKLAAC"
  # The deployment's own ARP entry (arp_n6/entries below): the interface, so the
  # data network can resolve the link's gateway before any session exists.
  - name: arp_n6
    mclass: UpfArpResponder
    arg: {max_entries: 65536}
  - name: dump_arp
    mclass: Dump
    arg: {interval: 1}
  # What the interface's frames and the responder's replies share: the port.
  - name: merge_n6
    mclass: Merge
  - name: l2_sort
    mclass: ExactMatch
    arg:
      fields:
        - {offset: 12, num_bytes: 2}  # the frame's EtherType (Eth)
      default_gate: 1
  - name: vif_n6
    mclass: Vif
    arg:
      default_gate: 0
      interfaces:
        # The N6 identity's route domain is the PDI's network instance and is
        # part of the downlink table key, keeping overlapping instances apart.
        - {id: 1, vlan: 0, mac_addr: "02:00:00:00:06:01", ip_addr: "192.0.2.2", route_domain: 1, gate: 1}
  # A frame no interface's MAC names.
  - name: sink_other
    mclass: Sink
  - name: pdr_dl
    mclass: WildcardMatch
    arg:
      fields:
        - {offset: 26, num_bytes: 4}
        - {offset: 30, num_bytes: 4}
        - {offset: 23, num_bytes: 1}
        - {offset: 34, num_bytes: 2}
        - {offset: 36, num_bytes: 2}
        - {attr_name: route_domain, num_bytes: 4}
        - {attr_name: fteid_context, num_bytes: 4}
        - {attr_name: qfi, num_bytes: 1}
      max_tuples: 8
      result_fields:
        - {attr_name: action_id, value_offset: 0, num_bytes: 4}
        - {attr_name: meter_id, value_offset: 4, num_bytes: 8, reference: mt_dl/meters, reference_key: BE32, reference_count: 2}
        - {attr_name: next_hop_id, value_offset: 12, num_bytes: 4, reference: rt/next_hops, reference_key: BE32}
        - {attr_name: route_domain, value_offset: 16, num_bytes: 4}
        - {attr_name: steering_policy_id, value_offset: 20, num_bytes: 4}
  - name: mt_dl
    mclass: Meter
    arg: {capacity: 65536, levels: 2}
  - name: cnt_dl
    mclass: UrrCount
    arg: {capacity: 65536}
  - name: atsss
    mclass: AtsssSteer
    arg: {policy_attr: steering_policy_id, next_hop_attr: next_hop_id}
connections:
  - {upstream: src_up, downstream: rewrite_up}
  - {upstream: rewrite_up, downstream: tag_n3}
  - {upstream: src_up2, downstream: rewrite_up2}
  - {upstream: rewrite_up2, downstream: tag_n3}
  - {upstream: src_up3, downstream: rewrite_up3}
  - {upstream: rewrite_up3, downstream: tag_n3}
  - {upstream: src_ulcl_n6, downstream: rewrite_ulcl_n6}
  - {upstream: rewrite_ulcl_n6, downstream: tag_n3}
  - {upstream: src_ulcl_n9, downstream: rewrite_ulcl_n9}
  - {upstream: rewrite_ulcl_n9, downstream: tag_n3}
  - {upstream: src_vn, downstream: rewrite_vn}
  - {upstream: rewrite_vn, downstream: tag_n3}
  - {upstream: src_n19out, downstream: rewrite_n19out}
  - {upstream: rewrite_n19out, downstream: tag_n3}
  - {upstream: src_m6ul10, downstream: rewrite_m6ul10}
  - {upstream: rewrite_m6ul10, downstream: tag_n3}
  - {upstream: src_m6ul13, downstream: rewrite_m6ul13}
  - {upstream: rewrite_m6ul13, downstream: tag_n3}
  - {upstream: src_m6fwd10, downstream: rewrite_m6fwd10}
  - {upstream: rewrite_m6fwd10, downstream: tag_n3}
  - {upstream: src_m6fwd13, downstream: rewrite_m6fwd13}
  - {upstream: rewrite_m6fwd13, downstream: tag_n3}
  - {upstream: tag_n3, downstream: decap0}
  - {upstream: src_n9, downstream: rewrite_n9}
  - {upstream: rewrite_n9, downstream: tag_n9}
  - {upstream: src_ulcl_dn9, downstream: rewrite_ulcl_dn9}
  - {upstream: rewrite_ulcl_dn9, downstream: tag_n9}
  - {upstream: src_m4ul, downstream: rewrite_m4ul}
  - {upstream: rewrite_m4ul, downstream: tag_n9}
  - {upstream: src_m4dl, downstream: rewrite_m4dl}
  - {upstream: rewrite_m4dl, downstream: tag_n9}
  - {upstream: src_n19in, downstream: rewrite_n19in}
  - {upstream: rewrite_n19in, downstream: tag_n9}
  - {upstream: src_m6dl10, downstream: rewrite_m6dl10}
  - {upstream: rewrite_m6dl10, downstream: tag_n9}
  - {upstream: src_m6t, downstream: rewrite_m6t}
  - {upstream: rewrite_m6t, downstream: tag_n9}
  - {upstream: em_n3, downstream: tag_n3}
  - {upstream: em_n9, downstream: tag_n9}
  - {upstream: tag_n9, downstream: decap0}
  - {upstream: decap0, downstream: mt_md, ogate: 0}
  - {upstream: decap0, downstream: pdr_dl, ogate: 1}
  - {upstream: decap0, downstream: echo_em, ogate: 2}
  - {upstream: echo_em, downstream: sink_em}
  - {upstream: mt_md, downstream: pdr_ul}
  - {upstream: pdr_ul, downstream: mt_ul}
  # The meter's yellow gate (its ogate 1) is the band between a QER's GBR and
  # its MBR (8.2.7, 8.2.8): forwarded beside green, and the policy a deployment
  # changes when that band should be marked or shed rather than passed.
  - {upstream: mt_ul, downstream: cnt_ul}
  - {upstream: mt_ul, downstream: cnt_ul, ogate: 1}
  - {upstream: cnt_ul, downstream: rt}
  # The exits: the data network's plain hop, the access side's and an instance's
  # tunnel (both through the encap, whose outer headers are the tunnel record's),
  # the service LAN's, and the re-injection into the subscriber-side table.
  - {upstream: rt, downstream: merge_n6, ogate: 0}
  - {upstream: rt, downstream: enc, ogate: 1}
  - {upstream: rt, downstream: enc, ogate: 2}
  - {upstream: rt, downstream: dump_lan, ogate: 3}
  - {upstream: dump_lan, downstream: sink_lan}
  - {upstream: rt, downstream: tag_vn, ogate: 4}
  - {upstream: tag_vn, downstream: pdr_dl}
  - {upstream: enc, downstream: mt_transport}
  - {upstream: mt_transport, downstream: dump_n3}
  - {upstream: dump_n3, downstream: sink_n3}
  - {upstream: decap0, downstream: em_relay, ogate: 3}
  - {upstream: em_relay, downstream: mt_em}
  - {upstream: mt_em, downstream: dump_em}
  - {upstream: dump_em, downstream: sink_em}

  - {upstream: src_dn, downstream: rewrite_dn}
  - {upstream: rewrite_dn, downstream: l2_sort}
  - {upstream: src_dn1, downstream: rewrite_dn1}
  - {upstream: rewrite_dn1, downstream: l2_sort}
  - {upstream: src_arp, downstream: rewrite_arp}
  - {upstream: rewrite_arp, downstream: l2_sort}
  - {upstream: src_arp2, downstream: rewrite_arp2}
  - {upstream: rewrite_arp2, downstream: l2_sort}
  # l2_sort's ARP rule (gate 0) is the responder's; everything else (the
  # default gate) is the interface's, and what no interface matches is dropped.
  - {upstream: l2_sort, downstream: arp_n6}
  - {upstream: arp_n6, downstream: dump_arp}
  - {upstream: dump_arp, downstream: merge_n6}
  - {upstream: l2_sort, downstream: tag_n6, ogate: 1}
  - {upstream: tag_n6, downstream: vif_n6}
  - {upstream: vif_n6, downstream: pdr_dl, ogate: 1}
  - {upstream: vif_n6, downstream: sink_other}
  - {upstream: merge_n6, downstream: dump_n6}
  - {upstream: dump_n6, downstream: sink_n6}

  - {upstream: pdr_dl, downstream: mt_dl}
  - {upstream: mt_dl, downstream: cnt_dl}
  - {upstream: mt_dl, downstream: cnt_dl, ogate: 1}
  - {upstream: cnt_dl, downstream: atsss}
  - {upstream: atsss, downstream: rt}

workers:
  - {wid: 0, core: 0}

resources:
  # The deployment's egress table (upfd -instances' *-next-hop keys, by id): hop
  # 1 the data network's exit, hop 2 the access side's, hop 3 a tunnel out of an
  # instance, hop 4 the service LAN's, hop 5 the re-injection's. Hops 1 and 4
  # carry their own L2 pair -- the Router writes a resolved hop's addresses into
  # the frame (BESS D-153), and ci/iface-path.sh byte-checks them -- while 2, 3
  # and 5 name a gate alone: the encap builds the tunnel's own header, and a
  # re-injected packet keeps the addresses it arrives with.
  rt/next_hops:
    - key: {id: 1}
      value: {egress_gate: 0, dst_mac: "AgAAAAYC", src_mac: "AgAAAAYB"}
    - key: {id: 2}
      value: {egress_gate: 1}
    - key: {id: 3}
      value: {egress_gate: 2}
    - key: {id: 4}
      value: {egress_gate: 3, dst_mac: "AgAAAAwC", src_mac: "AgAAAAwB"}
    - key: {id: 5}
      value: {egress_gate: 4}

  # l2_sort's one rule: ARP (0x0806) is the responder's.
  l2_sort/rules:
    - key: {fields: [{value_bin: "CAY="}]}
      value: {gate: 0}

  # The interface's own ARP entry. The sessions' entries are the driver's: one
  # per session per UE address, claimed and erased with the session.
  arp_n6/entries:
    - key: {ip: "192.0.2.2"}
      value: {mac_addr: "02:00:00:00:06:01"}
