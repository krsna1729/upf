<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    svg { color: #1f2328; }
    @media (prefers-color-scheme: dark) { svg { color: #e6edf3; } }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: currentColor; }
    .title { font-size: 15px; font-weight: 700; }
    .sub { font-size: 11px; fill: var(--muted, #6e7781); }
    .label { font-size: 12px; font-weight: 700; }
    .desc { font-size: 9px; fill: var(--muted, #6e7781); }
    .meta { font-size: 9px; fill: var(--accent, #0969da); font-weight: 600; }
    .pkt { font-size: 9px; fill: var(--warning, #bc4c00); font-weight: 600; }
    .gate { font-size: 9px; font-weight: 700; }
    .box { fill: none; stroke: var(--border, #8c959f); stroke-width: 1.5; rx: 5; }
    .box-hot { fill: none; stroke: var(--accent, #0969da); stroke-width: 2; rx: 5; }
    .box-port { fill: none; stroke: currentColor; stroke-width: 1.75; rx: 5; }
    .flow { fill: none; stroke: var(--fg, #57606a); stroke-width: 1.5; marker-end: url(#arrow); }
    .flow-meta { fill: none; stroke: var(--accent, #0969da); stroke-width: 1.5; marker-end: url(#arrow); }
    .flow-control { fill: none; stroke: var(--warning, #bc4c00); stroke-width: 1.5; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    .divider { stroke: var(--border, #8c959f); stroke-width: 1; stroke-dasharray: 5 4; }
  </style>

  <text x="24" y="28" class="title">UPF PACKET PATH</text>
  <text x="24" y="47" class="sub">Endpoint-keyed GTP-U admission, session PDRs, inner routing and routed outer tunnels</text>

  <!-- GTP-U and plain N6 ingress -->
  <g>
    <rect x="25" y="72" width="115" height="58" class="box-port"/>
    <text x="82" y="91" text-anchor="middle" class="label">N3 / N9 in</text>
    <text x="82" y="107" text-anchor="middle" class="desc">PortInc + Vif</text>
    <text x="82" y="121" text-anchor="middle" class="pkt">GTP-U / control</text>

    <rect x="170" y="72" width="150" height="58" class="box"/>
    <text x="245" y="91" text-anchor="middle" class="label">endpoint tag</text>
    <text x="245" y="107" text-anchor="middle" class="meta">endpoint_id</text>
    <text x="245" y="121" text-anchor="middle" class="meta">transport_route_domain</text>

    <rect x="350" y="58" width="215" height="116" class="box-hot"/>
    <text x="457" y="78" text-anchor="middle" class="label">GtpuDecap</text>
    <text x="457" y="96" text-anchor="middle" class="meta">key: endpoint/family/local IP/TEID</text>
    <text x="457" y="112" text-anchor="middle" class="desc">IPv4/IPv6 outer and inner packets</text>
    <text x="457" y="128" text-anchor="middle" class="desc">writes fteid_context and QFI</text>
    <text x="457" y="147" text-anchor="middle" class="gate">0 UL  ·  1 DL  ·  2 unknown/control</text>

    <path d="M 140 101 L 170 101" class="flow"/>
    <path d="M 320 101 L 350 101" class="flow-meta"/>

    <rect x="615" y="52" width="165" height="58" class="box-hot"/>
    <text x="697" y="70" text-anchor="middle" class="label">pdr_ul</text>
    <text x="697" y="87" text-anchor="middle" class="desc">WildcardMatch · inner flow</text>
    <text x="697" y="101" text-anchor="middle" class="meta">fteid_context + QFI</text>

    <rect x="615" y="125" width="165" height="58" class="box-hot"/>
    <text x="697" y="143" text-anchor="middle" class="label">pdr_dl</text>
    <text x="697" y="160" text-anchor="middle" class="desc">WildcardMatch · inner flow</text>
    <text x="697" y="174" text-anchor="middle" class="meta">route domain + fteid_context</text>

    <rect x="615" y="198" width="165" height="58" class="box"/>
    <text x="697" y="216" text-anchor="middle" class="label">GtpuResponder</text>
    <text x="697" y="233" text-anchor="middle" class="desc">unknown G-PDU → Error Ind.</text>
    <text x="697" y="247" text-anchor="middle" class="desc">Echo and control replies</text>

    <path d="M 565 81 L 615 81" class="flow"/>
    <text x="572" y="76" class="gate">gate 0</text>
    <path d="M 565 113 L 607 113 L 607 145 L 615 145" class="flow"/>
    <text x="570" y="109" class="gate">gate 1</text>
    <path d="M 565 140 L 599 140 L 599 227 L 615 227" class="flow-control"/>
    <text x="570" y="136" class="gate">gate 2</text>

    <rect x="25" y="178" width="115" height="58" class="box-port"/>
    <text x="82" y="197" text-anchor="middle" class="label">N6 in</text>
    <text x="82" y="213" text-anchor="middle" class="desc">plain IP / ARP / ND</text>
    <text x="82" y="227" text-anchor="middle" class="pkt">data network</text>
    <rect x="170" y="178" width="150" height="58" class="box"/>
    <text x="245" y="197" text-anchor="middle" class="label">vif_n6</text>
    <text x="245" y="213" text-anchor="middle" class="meta">route_domain</text>
    <text x="245" y="227" text-anchor="middle" class="meta">vif_id</text>
    <path d="M 140 207 L 170 207" class="flow"/>
    <path d="M 320 207 L 580 207 L 580 166 L 615 166" class="flow-meta"/>
    <text x="365" y="200" class="gate">plain N6 path</text>

    <rect x="810" y="88" width="170" height="105" class="box"/>
    <text x="895" y="108" text-anchor="middle" class="label">PDR treatment</text>
    <text x="895" y="127" text-anchor="middle" class="desc">per-direction Meter → UrrCount</text>
    <text x="895" y="144" text-anchor="middle" class="desc">DL: optional AtsssSteer</text>
    <text x="895" y="164" text-anchor="middle" class="meta">action_id + next_hop_id</text>
    <path d="M 780 81 L 795 81 L 795 117 L 810 117" class="flow"/>
    <path d="M 780 154 L 810 154" class="flow"/>

    <path d="M 730 337 L 730 272 L 795 272 L 795 175 L 780 175" class="flow-meta"/>
    <text x="736" y="267" class="gate">rt gate 4 · 5G-VN</text>
  </g>

  <line x1="25" y1="285" x2="975" y2="285" class="divider"/>
  <text x="25" y="306" class="sub">EGRESS · FAR next hop selects plain N6 or a tunnel; the post-encap Router handles outer IP</text>

  <!-- Egress and control replies -->
  <g>
    <rect x="25" y="337" width="150" height="64" class="box-port"/>
    <text x="100" y="357" text-anchor="middle" class="label">N3 / N9 out</text>
    <text x="100" y="375" text-anchor="middle" class="desc">PortOut</text>
    <text x="100" y="390" text-anchor="middle" class="meta">transport domain</text>

    <rect x="225" y="337" width="215" height="64" class="box"/>
    <text x="332" y="357" text-anchor="middle" class="label">rt_transport</text>
    <text x="332" y="375" text-anchor="middle" class="desc">destination + transport_route_domain</text>
    <text x="332" y="390" text-anchor="middle" class="meta">ARP/ND · TTL · Ethernet rewrite</text>

    <rect x="495" y="337" width="150" height="64" class="box"/>
    <text x="570" y="357" text-anchor="middle" class="label">GtpuEncap</text>
    <text x="570" y="375" text-anchor="middle" class="desc">TunnelEntry by ActionId</text>
    <text x="570" y="390" text-anchor="middle" class="meta">outer IPv4/IPv6 GTP-U</text>

    <rect x="710" y="337" width="150" height="64" class="box-hot"/>
    <text x="785" y="357" text-anchor="middle" class="label">rt</text>
    <text x="785" y="375" text-anchor="middle" class="desc">inner next-hop Router</text>
    <text x="785" y="390" text-anchor="middle" class="meta">TTL · neighbor L2</text>

    <rect x="885" y="337" width="90" height="64" class="box-port"/>
    <text x="930" y="357" text-anchor="middle" class="label">N6 out</text>
    <text x="930" y="375" text-anchor="middle" class="desc">plain IP</text>
    <text x="930" y="390" text-anchor="middle" class="meta">next hop</text>

    <path d="M 225 369 L 175 369" class="flow"/>
    <path d="M 495 369 L 440 369" class="flow"/>
    <path d="M 710 369 L 645 369" class="flow"/>
    <path d="M 860 380 L 885 380" class="flow"/>
    <text x="650" y="361" class="gate">tunnel hop</text>
    <text x="862" y="416" class="gate">plain hop (gate 0)</text>

    <path d="M 895 193 L 895 320 L 800 320 L 800 337" class="flow"/>
    <path d="M 695 256 L 695 310 L 332 310 L 332 337" class="flow-control"/>
    <text x="350" y="324" class="desc">GTP-U replies and End Markers enter rt_transport</text>
  </g>

  <text x="25" y="447" class="sub">Vif and Routers resolve neighbors with ARP/ND; unresolved routes fail closed. Default inner PDR address fields are IPv4.</text>
  <text x="25" y="465" class="sub">GtpuDecap gate 2 carries unknown G-PDUs and control; malformed packets drop. Outer GTP-U supports IPv4 and IPv6.</text>
</svg>
